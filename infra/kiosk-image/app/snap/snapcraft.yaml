# SHRIII kiosk application snap (KSK-09, KSK-10, PRV-07).
#
# Packages the hardened Electron runtime (frontend/apps/kiosk-electron, built by `electron-builder --linux
# dir` in CI and dropped into ./build/linux-unpacked) as a strictly confined Ubuntu Core 24 snap that runs as
# a daemon under Ubuntu Frame (Wayland). Snapcraft only packages here: the Electron build happens outside
# the snapcraft instance because LXD mounts only this project directory, not the monorepo.
#
#   CI:     .github/workflows/kiosk-image.yml (canonical/action-build, then snap-review / snapcraft lint)
#   local:  infra/kiosk-image/scripts/prepare-app-build.sh && snapcraft pack   (Linux with LXD only)
#
# Apps
#   kiosk      Electron under Frame; waits until the device is enrolled (kiosk-config.json exists)
#   enrol      consumes an enrolment bundle: device key + step-ca certificate + config, then finalises lockdown
#   cert-renew renews the short-lived device certificate (step ca renew --daemon) and re-imports it
#   netguard   host egress allow-list (nftables): API, step-ca, DNS, NTP and the snap store proxy only
#   step       step CLI, for operators on the bench (`sudo shriii-kiosk.step certificate inspect ...`)
name: shriii-kiosk
title: SHRIII Kiosk
base: core24
adopt-info: kiosk
summary: SHRIII behavioural games kiosk (Ubuntu Frame, offline-first)
description: |
  Touch-only, offline-first behavioural games kiosk runtime for the SHRIII study. Runs full screen under
  Ubuntu Frame on a locked-down Ubuntu Core 24 image, with an encrypted outbox, a device mTLS certificate
  from the SHRIII step-ca, an ESC/POS receipt printer and a host egress allow-list.
license: proprietary
grade: stable
confinement: strict
compression: lzo
assumes:
  - snapd2.63

platforms:
  amd64:

# The kiosk daemons run as root inside strict confinement (AppArmor + seccomp + mount namespace). Chromium
# refuses to start its own sandbox as root, so the renderer runs with --no-sandbox, as in Canonical's
# Electron-on-Frame reference; the snap sandbox is the boundary. Dropping to snap_daemon is a tracked
# follow-up (needs hardware validation of the Wayland socket hand-off).

apps:
  kiosk:
    extensions: [gpu]
    daemon: simple
    restart-condition: always
    restart-delay: 3s
    command-chain:
      - bin/wayland-launch
    command: bin/kiosk-launch
    plugs:
      - wayland
      - opengl
      - browser-support
      - audio-playback
      - network
      - hardware-observe
      - raw-usb
      - escpos-printer
    environment: &kiosk_env
      XDG_DATA_HOME: $SNAP_COMMON/xdg/data
      XDG_CONFIG_HOME: $SNAP_COMMON/xdg/config
      XDG_CACHE_HOME: $SNAP_COMMON/xdg/cache
      XDG_DATA_DIRS: $SNAP/usr/share
      XKB_CONFIG_ROOT: $SNAP/usr/share/X11/xkb
      GTK_USE_PORTAL: "0"
      GDK_GL: gles
      SHRIII_KIOSK_SNAP: "1"

  enrol:
    daemon: simple
    restart-condition: on-failure
    restart-delay: 10s
    command: bin/kiosk-enrol
    plugs:
      - network
      - snapd-control
      - hardware-observe

  cert-renew:
    daemon: simple
    restart-condition: always
    restart-delay: 30s
    command: bin/cert-renew
    plugs:
      - network

  netguard:
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    command: bin/netguard
    plugs:
      - network
      - firewall-control

  step:
    command: usr/bin/step
    plugs:
      - network
      - home

plugs:
  # Raw ESC/POS printer node (/dev/usb/lp*), slot defined by the kiosk gadget (custom-device interface).
  escpos-printer:
    interface: custom-device
    custom-device: escpos-printer

hooks:
  install:
    plugs: [network]
  configure:
    plugs: [network]

layout:
  /usr/share/fonts:
    bind: $SNAP/usr/share/fonts
  /usr/share/icons:
    bind: $SNAP/usr/share/icons
  /etc/fonts:
    bind: $SNAP/etc/fonts
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gtk-3.0:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gtk-3.0
  /usr/share/mime:
    bind: $SNAP/usr/share/mime
  /etc/gtk-3.0:
    bind: $SNAP/etc/gtk-3.0

parts:
  kiosk:
    # Prebuilt, unsigned electron-builder output (fuses flipped, asar integrity on) from CI.
    plugin: dump
    source: build
    organize:
      linux-unpacked: opt/shriii-kiosk
    stage:
      - -version.txt
    override-pull: |
      craftctl default
      test -x linux-unpacked/shriii-kiosk || { echo "build/linux-unpacked missing: run scripts/prepare-app-build.sh"; exit 1; }
      craftctl set version="$(cat version.txt)"
    override-build: |
      craftctl default
      # (organize runs after build, so the tree is still at linux-unpacked/ here; electron-builder already
      # trimmed the Chromium locales to en-US, hi, mr, ta via electronLanguages)
      chmod 0755 "$CRAFT_PART_INSTALL/linux-unpacked/shriii-kiosk"
    stage-packages:
      - libnspr4
      - libnss3
      - libnss3-tools          # pk12util/certutil: client certificate into the Chromium NSS DB
      - libatk-bridge2.0-0t64
      - libcups2t64
      - libgtk-3-0t64
      - libasound2t64
      - libpulse0
      - libgbm1
      - libxshmfence1
      - libxkbcommon0
      - libdrm2
      - xkb-data
      - fonts-noto-core        # Latin, Devanagari (hi, mr) and Tamil glyphs; no network fonts
      - fonts-noto-color-emoji
      - fontconfig-config

  gsettings-pixbuf-immodules:
    plugin: nil
    build-packages:
      - libgdk-pixbuf2.0-0
      - librsvg2-common
      - shared-mime-info
      - libgtk-3-0t64
    override-build: |
      craftctl default
      update-mime-database "${CRAFT_PART_INSTALL}/usr/share/mime"
      mkdir -p "${CRAFT_PART_INSTALL}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/gtk-3.0/3.0.0/"
      /usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/libgtk-3-0t64/gtk-query-immodules-3.0 \
        > "${CRAFT_PART_INSTALL}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/gtk-3.0/3.0.0/immodules.cache"
    stage-packages:
      - librsvg2-common
      - gsettings-desktop-schemas
      - libglib2.0-bin
    override-prime: |
      craftctl default
      /usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/glib-2.0/glib-compile-schemas "$CRAFT_PRIME/usr/share/glib-2.0/schemas"
      LOADERS_PATH=$(echo ${CRAFT_PRIME}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/gdk-pixbuf-2.0/*/loaders)
      QUERY_LOADERS=/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_ON}/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders
      GDK_PIXBUF_MODULEDIR=${LOADERS_PATH} ${QUERY_LOADERS} > ${LOADERS_PATH}/../loaders.cache
      sed s!$CRAFT_PRIME!!g --in-place ${LOADERS_PATH}/../loaders.cache

  step-cli:
    # smallstep CLI for enrolment (step ca certificate) and renewal (step ca renew --daemon).
    plugin: nil
    build-packages: [curl, ca-certificates]
    override-build: |
      set -eu
      STEP_VERSION=0.31.0
      base="https://github.com/smallstep/cli/releases/download/v${STEP_VERSION}"
      curl -fsSL -o step.tar.gz "${base}/step_linux_amd64.tar.gz"
      curl -fsSL -o checksums.txt "${base}/checksums.txt"
      grep ' step_linux_amd64.tar.gz$' checksums.txt | sed 's/step_linux_amd64.tar.gz/step.tar.gz/' | sha256sum -c -
      mkdir -p x "$CRAFT_PART_INSTALL/usr/bin"
      tar -xzf step.tar.gz -C x
      install -m 0755 "$(find x -type f -name step | head -n1)" "$CRAFT_PART_INSTALL/usr/bin/step"

  tools:
    # jq (bundle parsing), curl (snapd REST over the unix socket), nftables (netguard), inotify (launch waits).
    plugin: nil
    stage-packages:
      - jq
      - curl
      - nftables
      - inotify-tools
      - openssl

  scripts:
    plugin: dump
    source: src
    override-build: |
      craftctl default
      chmod 0755 "$CRAFT_PART_INSTALL"/bin/*

  cleanup:
    after: [kiosk, gsettings-pixbuf-immodules, step-cli, tools, scripts]
    plugin: nil
    override-prime: |
      craftctl default
      cd "$CRAFT_PRIME/usr/share/"
      rm -rf applications apport bash-completion dbus-1 doc-base doc gtk-doc help lintian man metainfo \
             pkgconfig libthai themes thumbnailers xml
