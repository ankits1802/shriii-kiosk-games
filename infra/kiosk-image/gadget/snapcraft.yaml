# SHRIII kiosk gadget (KSK-09): boot assets from canonical/pc-gadget (24), kiosk lockdown defaults,
# interface auto-connections, the ESC/POS printer custom-device slot and the kernel command line.
# gadget.yaml is rendered from gadget.yaml.in before packing (scripts/render-gadget.sh).
name: shriii-kiosk-pc
version: '24-0.1'
type: gadget
base: core24
summary: SHRIII kiosk gadget (amd64 PC, Ubuntu Core 24)
description: |
  Gadget for the SHRIII reference kiosk SKU: UEFI-only GPT layout with Secure Boot (Canonical-signed shim
  and grub) and TPM-backed full-disk encryption, console-conf and TTY logins disabled, hardware watchdog,
  overnight refresh window, power key ignored, Ubuntu Frame and the kiosk snap auto-connected.
confinement: strict
grade: stable

assumes:
  - snapd2.63

platforms:
  amd64:

slots:
  escpos-printer:
    interface: custom-device
    custom-device: escpos-printer
    devices:
      - /dev/usb/lp[0-9]
    udev-tagging:
      - kernel: lp[0-9]
        subsystem: usbmisc

hooks:
  prepare-device:
    environment:
      # Serial vault / model service API key: injected by the release pipeline from secrets, never committed.
      MODEL_APIKEY: ""

parts:
  boot-assets:
    plugin: nil
    build-packages:
      - sbsigntool
    stage-packages:
      - grub-efi-amd64-signed
      - shim-signed
    override-build: |
      set -x
      shim_path="${CRAFT_PART_INSTALL}/usr/lib/shim/shimx64.efi.dualsigned"
      fb_path="${CRAFT_PART_INSTALL}/usr/lib/shim/fbx64.efi"
      bootcsv_path="${CRAFT_PART_INSTALL}/usr/lib/shim/BOOTX64.CSV"
      grub_path="${CRAFT_PART_INSTALL}/usr/lib/grub/x86_64-efi-signed/grubx64.efi.signed"
      sbverify --list "$shim_path" | grep -E 'Canonical Ltd. Secure Boot Signing \(2022 v1\)'
      sbverify --list "$grub_path" | grep -E 'Canonical Ltd. Secure Boot Signing \(2022 v1\)'
      install -m 644 "$shim_path" "${CRAFT_PART_INSTALL}/shim.efi.signed"
      install -m 644 "$grub_path" "${CRAFT_PART_INSTALL}/grubx64.efi"
      install -m 644 "$fb_path" "${CRAFT_PART_INSTALL}/fb.efi"
      install -m 644 "$bootcsv_path" "${CRAFT_PART_INSTALL}/boot.csv"
      find "${CRAFT_PART_INSTALL}"/ -type f,l \
                -not -path "${CRAFT_PART_INSTALL}"/shim.efi.signed \
                -not -path "${CRAFT_PART_INSTALL}"/grubx64.efi \
                -not -path "${CRAFT_PART_INSTALL}"/fb.efi \
                -not -path "${CRAFT_PART_INSTALL}"/boot.csv \
                -not -path "${CRAFT_PART_INSTALL}/usr/share/doc/grub-efi-amd64-signed/*" \
           -and -not -path "${CRAFT_PART_INSTALL}/usr/share/doc/shim-signed/*" \
           -delete
      find "${CRAFT_PART_INSTALL}"/ -type d -empty -delete
      # grub.conf lets snapd identify grub as the (snapd-managed) bootloader
      install -m 644 /dev/null "${CRAFT_PART_INSTALL}/grub.conf"

  kernel-cmdline:
    plugin: dump
    source: cmdline
    stage:
      - cmdline.extra
