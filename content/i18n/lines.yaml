# SHRIII voice-line catalogue (VOX-02, VOX-07). Every player-facing sound is a PRE-RECORDED clip keyed by
# line id x language; there is no runtime TTS in production. reference_text (en-IN) is used ONLY to write
# recording scripts for native speakers and for ITC translation; it is never synthesised in production.
# voice_forbidden lines are never routed to the speakers (KSK-05 never-voice list).
# Recording status per language follows the ITC workflow; production packs contain only `approved` content.
schema_version: '1.0'
catalogue_version: 0.1.0
