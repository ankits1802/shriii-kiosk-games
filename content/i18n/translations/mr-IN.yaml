  - id: warmup.intro
    source_text: Let's warm up! First, a few easy taps.
    source_hash: a4cf2a984ddb1dec
    status: draft_machine_needs_native_review
    text: चला, आधी थोडा सराव करूया! आधी फक्त काही सोप्या गोष्टींना हात लावा.
    back_translation: Come, let's practise a little first! First, just touch a few easy things.
    register_note: 'Tone ''encouraging'': Light, upbeat praise; never childish or patronising to adults and elders.'
    translator_note: '''Warm up'' has no natural equivalent; rendered as ''practise a little''. ''Taps'' rendered as touching easy things.'
    record: true
    record_note: ''
    history: []
  - id: warmup.tap
    source_text: Touch the mango when it appears.
    source_hash: 27cda496a60d85c1
    status: draft_machine_needs_native_review
    text: आंबा दिसला की त्याला हात लावा.
    back_translation: When the mango appears, touch it.
