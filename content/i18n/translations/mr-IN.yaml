  - id: road_home.intro
    source_text: Time to go home. Plan your route, run your errands, and share fuel with your friend.
    source_hash: bf54bca08dcccc50
    status: draft_machine_needs_native_review
    text: आता घरी जायची वेळ झाली. रस्ता ठरवा, तुमची कामं उरका, आणि मित्रासोबत इंधन वाटून घ्या.
    back_translation: Now it's time to go home. Decide the road, finish your jobs, and share fuel with your friend.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: '''Fuel'' kept generic (hi ईंधन, mr इंधन, ta எரிபொருள்) because the vehicle art is not final; once it is, field-test the spoken word (petrol / diesel / तेल / பெட்ரோல்). मित्र is masculine; if the partner character is a woman use मैत्रीण (see gender-roles adaptation sheet).'
