    source_text: Namaste! Come and play a short game at the market fair.
    source_hash: d6c55d5e6c795c85
    status: draft_machine_needs_native_review
    text: नमस्कार! या, जत्रेतल्या बाजारात एक छोटासा खेळ खेळा.
    back_translation: Namaskar! Come, play a little game at the market in the village fair (jatra).
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Greeting adapted to नमस्कार (Marathi everyday greeting); 'market fair' rendered as जत्रा, the familiar Maharashtrian village fair.
