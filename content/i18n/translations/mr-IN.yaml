  - id: dont_tap.prompt.serve
    source_text: Serve!
    source_hash: a80f0983c63d25c0
    status: draft_machine_needs_native_review
    text: द्या!
    back_translation: Give!
    register_note: 'Tone ''playful'': Short, bright cue; must stay crisp because response latency is timed from its end.'
    translator_note: Go cue; response latency is timed from the end of this clip. Keep it one crisp word, identical length feel across languages.
    record: true
    record_note: ''
    history: []
  - id: dont_tap.pressure_cue
    source_text: The crowd is here! Serve fast, but only good fruit.
    source_hash: 29a14239435307f9
    status: draft_machine_needs_native_review
    text: गर्दी आली! पटपट द्या, पण फक्त चांगली फळं.
    back_translation: The crowd has come! Give quickly, but only good fruits.
    register_note: 'Tone ''urgent'': Brisk and energetic but friendly; excitement of a busy market, not alarm.'
    translator_note: 'Announced pressure block: energetic, not alarming. The ''only good fruit'' rule must stay as prominent as ''fast''.'
    record: true
    record_note: ''
    history: []
  - id: tower.skip_hint
    source_text: If you think it cannot be done, you may touch the arrow to skip.
    source_hash: 11b5d34038a8df56
    status: draft_machine_needs_native_review
    text: हे होणार नाही असं वाटलं, तर पुढे जायला बाणाला हात लावू शकता.
    back_translation: If you feel this won't happen, you can touch the arrow to go ahead.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: 'Persistence measure (time on unsolvable items): the hint must stay neutral, neither encouraging nor discouraging skipping, and must not reveal that some puzzles are unsolvable.'
    record: true
    record_note: ''
    history: []
  - id: stall.customer.calm
    source_text: Namaste! Two good mangoes, please.
    source_hash: 1044f32fe52305b4
    status: draft_machine_needs_native_review
    text: नमस्कार! दोन चांगले आंबे द्या हो.
    back_translation: Namaskar! Give two good mangoes, please.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Customer voice (stimulus, tone level 0-1). The number of mangoes is spoken and shown as two pictured mangoes; no digits. हो at the end is the polite softener of spoken Marathi.
    record: true
    record_note: ''
    history: []
  - id: stall.customer.hostile
    source_text: Hurry up! Why is this taking so long?
    source_hash: 54db199a259d367a
    status: draft_machine_needs_native_review
    text: अहो, आटपा लवकर! एवढा वेळ का लावताय?
    back_translation: Hey, finish up quickly! Why are you taking so long?
    register_note: 'Tone ''hostile'': Recorded STIMULUS (rude customer). Impatient and sharp in tone only; no insults, abuse, caste, religion or gender references. Rudeness intensity must be matched across languages (see adaptation sheet customer-rudeness).'
    translator_note: 'Hostile customer STIMULUS (tone level 3-4). Rude through impatience and tone only: no insults or identity references. Rudeness intensity must be matched across languages by the voice director (customer-rudeness adaptation sheet). अहो keeps it adult-to-adult; rudeness carried by आटपा and the accusing का लावताय.'
    record: true
    record_note: ''
    history: []
