  - id: bands.literacy.question
    source_text: Can you read a letter or a newspaper? Easily, with difficulty, or not at all?
    source_hash: c71870f7388a1183
    status: draft_machine_needs_native_review
    text: तुम्हाला पत्र किंवा पेपर वाचता येतं का? सहज, थोडं कष्टानं, की अजिबात नाही?
    back_translation: Can you read a letter or the paper? Easily, with some effort, or not at all?
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: 'Sensitive question: neutral, matter-of-fact delivery with no hint that one answer is better. ''Not at all'' must sound as acceptable as ''easily''. पेपर is the everyday word for newspaper (वर्तमानपत्र is bookish).'
