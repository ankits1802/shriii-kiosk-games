  - id: private_dice.intro
    source_text: Roll the dice in your cupped hands. Only you see it. Then touch the picture that matches.
    source_hash: 4cebca380e8d7e05
    status: draft_machine_needs_native_review
    text: फासा तुमच्या ओंजळीत हलवून टाका. तो फक्त तुम्हालाच दिसेल. मग जुळणाऱ्या चित्राला हात लावा.
    back_translation: Shake the dice in your cupped hands and throw it. Only you will see it. Then touch the matching picture.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Privacy of the roll must be clear and believable (group-level integrity only, MG-06). Dice can carry gambling connotations; see the dice/luck adaptation sheet. ओंजळ is the exact Marathi word for cupped hands.
