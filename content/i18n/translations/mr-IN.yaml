  - id: consent.core.segment_1
    source_text: We will play a few short games at a village market. There are no right or wrong people, only choices.
    source_hash: 606344efea9df472
    status: draft_machine_needs_native_review
    text: आपण एका गावच्या बाजारात काही छोटे खेळ खेळणार आहोत. यात कोणी बरोबर किंवा चूक नसतं, फक्त आपापल्या निवडी असतात.
    back_translation: We are going to play some small games at a village market. In this nobody is right or wrong; there are only each person's own choices.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: 'Consent script: meaning must be exact and calm. The source ''no right or wrong people'' means nobody is judged; rendered as ''no person is right or wrong, only one''s own choices''.'
    record: true
    record_note: ''
    history: []
  - id: consent.core.segment_2
    source_text: We keep only your taps and choices, with no name. We never keep your voice or any recording.
    source_hash: b4cdd252dead7546
    status: draft_machine_needs_native_review
    text: आम्ही फक्त तुम्ही काय दाबलं आणि काय निवडलं एवढंच ठेवतो, तुमचं नाव नाही. तुमचा आवाज किंवा कुठलंही रेकॉर्डिंग आम्ही कधीच ठेवत नाही.
    back_translation: We keep only what you pressed and what you chose, not your name. We never keep your voice or any recording.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: 'Privacy promise (PRV-03): ''never keep your voice'' must stay unconditional; reviewers must not soften it.'
    record: true
    record_note: ''
    history: []
  - id: consent.core.segment_3
    source_text: You can stop at any time by touching the hand. You can also ask us to delete what you played.
    source_hash: b470a591226d26a0
    status: draft_machine_needs_native_review
    text: हाताच्या खुणेला हात लावून तुम्ही केव्हाही थांबू शकता. तुम्ही खेळलेलं पुसून टाकायला आम्हाला सांगूही शकता.
    back_translation: By touching the hand sign you can stop any time. You can also tell us to wipe out what you played.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: 'Withdrawal right (ONB-06): both ''stop any time'' and ''ask us to delete'' must survive back-translation.'
    record: true
    record_note: ''
    history: []
  - id: consent.core.segment_4
    source_text: At the end you may hear a short picture summary. It is a snapshot of today's play, not a test or a diagnosis.
    source_hash: eed5880d6204d452
    status: draft_machine_needs_native_review
    text: शेवटी तुम्ही कसं खेळलात, ते चित्रांसोबत थोडक्यात ऐकायला मिळू शकेल. ही फक्त आजच्या खेळाची एक झलक आहे; ही परीक्षा नाही, आणि कुठल्या आजाराची तपासणीही नाही.
    back_translation: At the end you may get to hear briefly, with pictures, how you played. This is only a glimpse of today's game; it is not an exam, and not a check-up for any illness.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: '''Diagnosis'' has no everyday word; rendered as ''a check for illness'' so that non-literate listeners understand it is not medical. ''Summary'' rendered as ''glimpse'' (hi/mr झलक) / ''brief'' (ta சுருக்கம்).'
    record: true
    record_note: ''
    history: []
  - id: consent.core.question
    source_text: If you agree, touch the tick. If not, touch the cross.
    source_hash: d0387b4c0fbc40f1
    status: draft_machine_needs_native_review
    text: तुम्हाला मान्य असेल, तर बरोबरच्या खुणेला हात लावा. नसेल, तर फुलीला हात लावा.
    back_translation: If it is acceptable to you, touch the correct-mark. If not, touch the cross.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: Consent is committed by tap only; the line must not imply that speaking 'yes' is enough.
    record: true
    record_note: ''
    history: []
  - id: consent.archive.question
    source_text: May we keep your anonymous play for future research? Touch the tick for yes, or leave it for no.
    source_hash: fc2941413a233b2f
    status: draft_machine_needs_native_review
    text: तुमचा हा खेळ, नाव न ठेवता, पुढच्या संशोधनासाठी आम्ही ठेवू का? हो असेल, तर बरोबरच्या खुणेला हात लावा; नाही असेल, तर काही करू नका.
    back_translation: May we keep this game of yours, without keeping your name, for future research? If yes, touch the correct-mark; if no, do nothing.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: Default is NO (leave it). 'Anonymous' rendered as 'without (your) name'. संशोधन is common in spoken Marathi media; reviewers may prefer अभ्यास for rural listeners.
    record: true
    record_note: ''
    history: []
