  - id: weighing_post.new_rule
    source_text: Listen! From now on, sacks that lean to the left must be fined.
    source_hash: 61ef41b2af43143d
    status: draft_machine_needs_native_review
    text: ऐका! आतापासून, डावीकडे झुकणाऱ्या पोत्यांवर दंड लावायचा.
    back_translation: Listen! From now on, sacks that lean to the left are to be fined.
    register_note: 'Tone ''firm'': Clear, authoritative market-official announcement; firm but not threatening.'
    translator_note: Announced rule change (context shift). 'Left' is from the player's point of view; the scene must show it with an arrow because left/right words are a known comprehension risk for some participants.
    record: true
    record_note: ''
    history: []
  - id: weighing_post.quantity_prefix
    source_text: 'The needle shows:'
    source_hash: 52041152c063d6fa
    status: draft_machine_needs_native_review
    text: 'काटा दाखवतोय:'
    back_translation: 'The needle is showing:'
    register_note: 'Tone ''neutral'': Plain, even delivery; no emotional colouring.'
    translator_note: 'Concatenated before a spoken quantity clip. Hindi and Marathi are verb-final, so ''needle shows: five kilo'' is a spoken right-dislocation; acceptable in speech but should be checked. Tamil uses a nominalised form that works as a prefix. Alternative: record whole sentences per quantity.'
    record: true
    record_note: ''
