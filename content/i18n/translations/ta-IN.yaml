  - id: stop.hand_prompt
    source_text: Do you want to keep what you played, or delete it?
    source_hash: 5c08f9f5236fa334
    status: draft_machine_needs_native_review
    text: நீங்க விளையாடினதை வச்சுக்கணுமா, இல்ல அழிச்சுடணுமா?
