  - id: consent.core.segment_1
    source_text: We will play a few short games at a village market. There are no right or wrong people, only choices.
    source_hash: 606344efea9df472
    status: draft_machine_needs_native_review
    text: ஒரு கிராமத்துச் சந்தையில சில சின்ன விளையாட்டுகள் விளையாடப் போறோம். இதுல யாரும் சரியானவங்களோ தப்பானவங்களோ இல்ல; ஒவ்வொருத்தரோட தேர்வு மட்டும்தான்.
    back_translation: We are going to play some small games in a village market. Here nobody is a right or a wrong person; there is only each person's choice.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: 'Consent script: meaning must be exact and calm. The source ''no right or wrong people'' means nobody is judged; rendered as ''no person is right or wrong, only one''s own choices''.'
    record: true
    record_note: ''
    history: []
  - id: consent.core.segment_2
    source_text: We keep only your taps and choices, with no name. We never keep your voice or any recording.
    source_hash: b4cdd252dead7546
    status: draft_machine_needs_native_review
    text: நீங்க எதைத் தொட்டீங்க, எதைத் தேர்வு செஞ்சீங்கன்னு மட்டும்தான் வச்சுக்குவோம்; உங்க பேரை இல்ல. உங்க குரலையோ, எந்த ரெக்கார்டிங்கையுமோ நாங்க எப்பவுமே வச்சுக்க மாட்டோம்.
    back_translation: We will keep only what you touched and what you chose; not your name. We will never keep your voice or any recording.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: 'Privacy promise (PRV-03): ''never keep your voice'' must stay unconditional; reviewers must not soften it.'
    record: true
    record_note: ''
    history: []
  - id: consent.core.segment_3
    source_text: You can stop at any time by touching the hand. You can also ask us to delete what you played.
    source_hash: b470a591226d26a0
    status: draft_machine_needs_native_review
    text: கை படத்தைத் தொட்டு, எப்ப வேணும்னாலும் நிறுத்திக்கலாம். நீங்க விளையாடினதை அழிக்கச் சொல்லியும் கேட்கலாம்.
    back_translation: By touching the hand picture, you can stop whenever you want. You can also ask us to erase what you played.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: 'Withdrawal right (ONB-06): both ''stop any time'' and ''ask us to delete'' must survive back-translation.'
    record: true
    record_note: ''
    history: []
  - id: consent.core.segment_4
    source_text: At the end you may hear a short picture summary. It is a snapshot of today's play, not a test or a diagnosis.
    source_hash: eed5880d6204d452
    status: draft_machine_needs_native_review
    text: கடைசியில, நீங்க எப்படி விளையாடினீங்கன்னு படங்களோட சுருக்கமா கேட்கலாம். இது இன்னைக்கு விளையாட்டோட ஒரு சின்ன பார்வை மட்டும்தான்; இது தேர்வும் இல்ல, எந்த நோய்க்கான பரிசோதனையும் இல்ல.
    back_translation: At the end, you may hear briefly, with pictures, how you played. This is only a small view of today's game; it is not an exam, and not a test for any illness.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: '''Diagnosis'' has no everyday word; rendered as ''a check for illness'' so that non-literate listeners understand it is not medical. ''Summary'' rendered as ''glimpse'' (hi/mr झलक) / ''brief'' (ta சுருக்கம்).'
    record: true
    record_note: ''
    history: []
  - id: consent.core.question
    source_text: If you agree, touch the tick. If not, touch the cross.
    source_hash: d0387b4c0fbc40f1
    status: draft_machine_needs_native_review
    text: உங்களுக்குச் சம்மதம்னா, சரி குறியைத் தொடுங்க. இல்லைன்னா, பெருக்கல் குறியைத் தொடுங்க.
    back_translation: If you consent, touch the right mark. If not, touch the X mark.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: Consent is committed by tap only; the line must not imply that speaking 'yes' is enough.
    record: true
    record_note: ''
    history: []
  - id: consent.archive.question
    source_text: May we keep your anonymous play for future research? Touch the tick for yes, or leave it for no.
    source_hash: fc2941413a233b2f
    status: draft_machine_needs_native_review
    text: உங்க பேர் இல்லாம, நீங்க விளையாடினதை வருங்கால ஆராய்ச்சிக்காக நாங்க வச்சுக்கலாமா? சரின்னா, சரி குறியைத் தொடுங்க; வேண்டாம்னா, எதையும் தொட வேண்டாம்.
    back_translation: Without your name, may we keep what you played for future research? If yes, touch the right mark; if you don't want to, you need not touch anything.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: Default is NO (leave it). 'Anonymous' rendered as 'without (your) name'.
    record: true
    record_note: ''
    history: []
