  - id: four_stalls.intro
    source_text: Pick a stall to buy from. Some stalls are luckier than others.
    source_hash: 9a38ab637ecd8016
    status: draft_machine_needs_native_review
    text: வாங்குறதுக்கு ஒரு கடையைத் தேர்வு செய்யுங்க. சில கடைகள்ல மத்ததைவிட அதிர்ஷ்டம் அதிகம்.
    back_translation: Choose a shop to buy from. Some shops have more luck than others.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: '''Luck'' may evoke astrology or auspiciousness; see the dice/luck adaptation sheet. Must not suggest which stall is lucky.'
