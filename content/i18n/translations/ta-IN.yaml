  - id: balloon.intro
    source_text: Pump the balloon to fill your jar. Collect before it bursts!
    source_hash: 1f37ccd7769fcef8
    status: draft_machine_needs_native_review
    text: பலூன்ல காத்து அடிங்க, அதனால உங்க ஜாடி நிறையும். பலூன் வெடிக்குறதுக்கு முன்னாடியே சேர்த்துக்கோங்க!
    back_translation: Pump air into the balloon; that way your jar will fill. Collect before the balloon bursts!
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: 'Risk task (MG-01): do not add advice such as ''be careful'' or ''pump more''; keep the source''s neutral balance.'
