    history: []
  - id: dont_tap.replay
    source_text: Here are the instructions again.
    source_hash: 8add2a435f7d980a
    status: draft_machine_needs_native_review
    text: என்ன செய்யணும்னு இன்னொரு தடவை கேளுங்க.
    back_translation: Listen one more time to what you need to do.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
