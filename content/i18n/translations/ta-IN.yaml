    history: []
  - id: report.initiative.pole_a
    source_text: You focus on what is asked of you.
    source_hash: ba83ba5d12adf09f
    status: draft_machine_needs_native_review
    text: உங்ககிட்ட என்ன கேட்கப்படுதோ, அதுல முழுக் கவனம் செலுத்துவீங்க.
    back_translation: Whatever is asked of you, you give it full attention.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: 'Strengths-framed band phrase: must sound positive and non-judgemental; no numbers, no comparison with others.'
    record: true
    record_note: ''
    history: []
  - id: report.initiative.centre
    source_text: You sometimes take extra steps on your own.
    source_hash: e5b5d48065420748
    status: draft_machine_needs_native_review
    text: சில சமயம் நீங்களாவே கூடுதலா சில விஷயங்களைச் செய்வீங்க.
    back_translation: Sometimes you do some extra things on your own.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: 'Strengths-framed band phrase: must sound positive and non-judgemental; no numbers, no comparison with others.'
    record: true
