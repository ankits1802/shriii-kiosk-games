    status: draft_machine_needs_native_review
    text: எதையும் செய்யுறதுக்கு முன்னாடி கொஞ்சம் நிதானிச்சுச் சரிபார்த்துக்குவீங்க.
    back_translation: Before doing anything, you pause a little and check.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: 'Strengths-framed band phrase: must sound positive and non-judgemental; no numbers, no comparison with others.'
    record: true
    record_note: ''
    history: []
  - id: report.emotional_regulation.pole_a
    source_text: You show your feelings openly.
    source_hash: bb8cee683a4b6133
    status: draft_machine_needs_native_review
    text: உங்க மனசுல இருக்கிறதை நீங்க வெளிப்படையாக் காட்டுவீங்க.
