    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: ''
    record: true
    record_note: ''
    history: []
  - id: walkaway.countdown
    source_text: The game will end soon. Touch the screen to keep playing.
    source_hash: 25dfe372524164ab
    status: draft_machine_needs_native_review
    text: விளையாட்டு சீக்கிரம் முடிஞ்சிடும். தொடர்ந்து விளையாட, திரையைத் தொடுங்க.
    back_translation: The game will end soon. To keep playing, touch the screen.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: ''
    record: true
    record_note: ''
    history: []
  - id: walkaway.goodbye
    source_text: Thank you for playing. Goodbye!
    source_hash: 9046692bea240db4
    status: draft_machine_needs_native_review
    text: விளையாடினதுக்கு நன்றி. போயிட்டு வாங்க!
    back_translation: Thanks for playing. Go and come back again!
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: '''Goodbye'' rendered with the idiomatic leave-taking of each language (hi/mr ''we''ll meet again'', ta ''go and come back'').'
    record: true
    record_note: ''
