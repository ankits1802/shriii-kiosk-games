    source_hash: 29a14239435307f9
    status: draft_machine_needs_native_review
    text: கூட்டம் வந்துடுச்சு! சீக்கிரம் கொடுங்க, ஆனா நல்ல பழம் மட்டும்!
    back_translation: The crowd has come! Give quickly, but only good fruit!
    register_note: 'Tone ''urgent'': Brisk and energetic but friendly; excitement of a busy market, not alarm.'
    translator_note: 'Announced pressure block: energetic, not alarming. The ''only good fruit'' rule must stay as prominent as ''fast''.'
    record: true
    record_note: ''
    history: []
  - id: tower.skip_hint
    source_text: If you think it cannot be done, you may touch the arrow to skip.
    source_hash: 11b5d34038a8df56
    status: draft_machine_needs_native_review
    text: இதைச் செய்ய முடியாதுன்னு தோணுச்சுன்னா, அடுத்ததுக்குப் போக அம்புக்குறியைத் தொடலாம்.
    back_translation: If you feel this can't be done, you can touch the arrow to go to the next one.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: 'Persistence measure (time on unsolvable items): the hint must stay neutral, neither encouraging nor discouraging skipping, and must not reveal that some puzzles are unsolvable.'
    record: true
    record_note: ''
    history: []
  - id: stall.customer.calm
    source_text: Namaste! Two good mangoes, please.
    source_hash: 1044f32fe52305b4
    status: draft_machine_needs_native_review
    text: வணக்கம்! ரெண்டு நல்ல மாம்பழம் குடுங்க.
    back_translation: Vanakkam! Give me two good mangoes.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Customer voice (stimulus, tone level 0-1). The number of mangoes is spoken and shown as two pictured mangoes; no digits.
    record: true
    record_note: ''
    history: []
  - id: stall.customer.hostile
    source_text: Hurry up! Why is this taking so long?
    source_hash: 54db199a259d367a
    status: draft_machine_needs_native_review
    text: சீக்கிரம்! ஏன் இவ்ளோ நேரம் ஆகுது?
    back_translation: Quick! Why is it taking this long?
    register_note: 'Tone ''hostile'': Recorded STIMULUS (rude customer). Impatient and sharp in tone only; no insults, abuse, caste, religion or gender references. Rudeness intensity must be matched across languages (see adaptation sheet customer-rudeness).'
    translator_note: 'Hostile customer STIMULUS (tone level 3-4). Rude through impatience and tone only: no insults or identity references. Rudeness intensity must be matched across languages by the voice director (customer-rudeness adaptation sheet). Short clipped phrasing; rudeness carried by the voice. Avoid -ப்பா/-ம்மா address, which would assign a gender to the player.'
    record: true
    record_note: ''
    history: []
  - id: stall.rush_cue
    source_text: Rush time! Many customers are coming.
    source_hash: 871a0c7cbb69fea4
    status: draft_machine_needs_native_review
    text: கூட்ட நேரம்! நிறைய பேர் வர்றாங்க.
    back_translation: Rush time! Many people are coming.
    register_note: 'Tone ''urgent'': Brisk and energetic but friendly; excitement of a busy market, not alarm.'
    translator_note: ''
    record: true
    record_note: ''
    history: []
  - id: weighing_post.new_rule
    source_text: Listen! From now on, sacks that lean to the left must be fined.
    source_hash: 61ef41b2af43143d
    status: draft_machine_needs_native_review
    text: கவனிங்க! இனிமே, இடது பக்கம் சாயுற மூட்டைக்கு அபராதம் போடணும்.
    back_translation: Listen! From now on, a sack that leans to the left side must be fined.
    register_note: 'Tone ''firm'': Clear, authoritative market-official announcement; firm but not threatening.'
    translator_note: Announced rule change (context shift). 'Left' is from the player's point of view; the scene must show it with an arrow because left/right words are a known comprehension risk for some participants.
    record: true
    record_note: ''
    history: []
  - id: weighing_post.quantity_prefix
    source_text: 'The needle shows:'
    source_hash: 52041152c063d6fa
    status: draft_machine_needs_native_review
    text: 'முள் காட்டுறது:'
    back_translation: 'What the needle shows:'
    register_note: 'Tone ''neutral'': Plain, even delivery; no emotional colouring.'
    translator_note: 'Concatenated before a spoken quantity clip. Hindi and Marathi are verb-final, so ''needle shows: five kilo'' is a spoken right-dislocation; acceptable in speech but should be checked. Tamil uses a nominalised form that works as a prefix. Alternative: record whole sentences per quantity.'
    record: true
    record_note: ''
    history: []
  - id: road_home.block_cue
    source_text: Oh! The road is blocked.
    source_hash: 47ee638348fd5818
    status: draft_machine_needs_native_review
    text: அடடா! ரோடு அடைச்சிருக்கு.
    back_translation: Oh dear! The road is blocked.
    register_note: 'Tone ''neutral'': Plain, even delivery; no emotional colouring.'
    translator_note: Must not mention or hint at any rule change (the reversal is unannounced, EPI-03).
    record: true
    record_note: ''
    history: []
  - id: hub.bridge
    source_text: Let's visit the next stall.
    source_hash: 8a53291ab66114b2
    status: draft_machine_needs_native_review
    text: வாங்க, அடுத்த கடைக்குப் போகலாம்.
    back_translation: Come, let's go to the next shop.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: ''
    record: true
    record_note: ''
    history: []
  - id: feedback.well_done
    source_text: Well done!
    source_hash: 462164a0645e1ed2
    status: draft_machine_needs_native_review
    text: நல்லா பண்ணீங்க!
    back_translation: You did well!
    register_note: 'Tone ''encouraging'': Light, upbeat praise; never childish or patronising to adults and elders.'
    translator_note: Neutral-positive, never a score. Adult register (avoid hi शाबाश).
    record: true
    record_note: ''
    history: []
  - id: feedback.try_again
    source_text: Let's try again.
    source_hash: b1a2748c74f6eef2
    status: draft_machine_needs_native_review
    text: இன்னொரு தடவை!
    back_translation: One more time!
    register_note: 'Tone ''encouraging'': Light, upbeat praise; never childish or patronising to adults and elders.'
    translator_note: Target is under one second; 'one more time!' is the natural short spoken form of 'let's try again'.
    record: true
    record_note: ''
    history: []
  - id: feedback.correct_sound_hint
    source_text: That sound means right.
    source_hash: 766d1c4b4612485d
    status: draft_machine_needs_native_review
    text: இந்தச் சத்தம்னா சரி.
    back_translation: This sound means right.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Played right after the sound, so 'this sound' is more natural than 'that sound'.
    record: true
    record_note: ''
    history: []
  - id: feedback.wrong_sound_hint
    source_text: That sound means not this time.
    source_hash: 5b1b1fd201493781
    status: draft_machine_needs_native_review
    text: இந்தச் சத்தம்னா, இந்தத் தடவை இல்ல.
    back_translation: 'This sound means: not this time.'
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: 'Must stay gentle: do not use the words for ''wrong'' (hi गलत, mr चूक, ta தப்பு).'
    record: true
    record_note: ''
    history: []
  - id: walkaway.reprompt
    source_text: Your turn! Touch the screen when you are ready.
    source_hash: aa1d430d57647af0
    status: draft_machine_needs_native_review
    text: உங்க முறை! தயாரானதும் திரையைத் தொடுங்க.
    back_translation: Your turn! Once you're ready, touch the screen.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: ''
    record: true
    record_note: ''
    history: []
  - id: walkaway.still_there
    source_text: Are you still there?
    source_hash: 69b81bb4dec2efcc
    status: draft_machine_needs_native_review
    text: நீங்க இன்னும் இங்க இருக்கீங்களா?
