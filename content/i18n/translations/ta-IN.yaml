    history: []
  - id: report.self_control.pole_a
    source_text: You are quick to act when you see a chance.
    source_hash: b105c71f63468444
    status: draft_machine_needs_native_review
    text: வாய்ப்பு தெரிஞ்சதும் நீங்க உடனே செயல்படுவீங்க.
    back_translation: As soon as you see a chance, you act at once.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: 'Strengths-framed band phrase: must sound positive and non-judgemental; no numbers, no comparison with others.'
    record: true
    record_note: ''
    history: []
  - id: report.self_control.centre
    source_text: You balance acting quickly with holding back.
    source_hash: ca487288f8bc4f2d
    status: draft_machine_needs_native_review
    text: சட்டுனு செய்யுறதையும் நிதானிக்கிறதையும் சரியா கலந்து செய்வீங்க.
    back_translation: You mix acting swiftly and pausing well.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: 'Strengths-framed band phrase: must sound positive and non-judgemental; no numbers, no comparison with others.'
    record: true
    record_note: ''
    history: []
  - id: report.self_control.pole_b
    source_text: You take a moment to hold back and check before acting.
