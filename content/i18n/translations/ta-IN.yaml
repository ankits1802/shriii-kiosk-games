    back_translation: You have chosen Hindi. To continue, touch the right mark; to choose again, touch the X (cross) mark.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Played in Hindi right after the Hindi face is chosen; only that language version is recorded. 'tick' = சரி குறி, 'cross' = பெருக்கல் குறி (X sign); field-test against the loanwords டிக் / கிராஸ்.
