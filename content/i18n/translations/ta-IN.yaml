  - id: report.integrity.pole_b
    source_text: You choose the fair path even when no one is watching.
    source_hash: 4a84e11820a1eeba
    status: draft_machine_needs_native_review
    text: யாரும் பார்க்கலைன்னாலும், நீங்க நியாயமான வழியையே தேர்வு செய்வீங்க.
    back_translation: Even if nobody is watching, you choose the fair way.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: 'Strengths-framed band phrase: must sound positive and non-judgemental; no numbers, no comparison with others.'
