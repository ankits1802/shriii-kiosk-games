  - id: card_sort.intro
    source_text: Help sort the cards into the baskets. Listen to the sound to learn if a card is right.
    source_hash: 60f38981e632f1c4
    status: draft_machine_needs_native_review
    text: கார்டுகளைக் கூடைகள்ல பிரிச்சு வைக்க உதவுங்க. கார்டு சரியா போச்சா இல்லையான்னு சத்தத்தைக் கேட்டுத் தெரிஞ்சுக்கலாம்.
    back_translation: Help separate the cards into the baskets. You can find out from the sound whether the card went right or not.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Must NOT explain the sorting rule or hint that it will change (unannounced switch, MG-03). கார்டு used, not சீட்டு (gambling connotation).
    record: true
