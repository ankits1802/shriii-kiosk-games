  - id: attract.greeting
    source_text: Namaste! Come and play a short game at the market fair.
    source_hash: d6c55d5e6c795c85
    status: draft_machine_needs_native_review
    text: வணக்கம்! வாங்க, சந்தைத் திருவிழாவுல ஒரு சின்ன விளையாட்டு விளையாடுங்க.
    back_translation: Vanakkam! Come, play a small game at the market festival.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Greeting adapted to வணக்கம் (நமஸ்தே is not used in everyday Tamil); 'fair' rendered as திருவிழா (festival fair).
