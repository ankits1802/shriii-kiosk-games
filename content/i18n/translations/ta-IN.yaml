  - id: road_home.intro
    source_text: Time to go home. Plan your route, run your errands, and share fuel with your friend.
    source_hash: bf54bca08dcccc50
    status: draft_machine_needs_native_review
    text: வீட்டுக்குப் போற நேரம் வந்துடுச்சு. எந்த வழியில போகணும்னு யோசிங்க, உங்க வேலைகளை முடிங்க, உங்க நண்பரோட எரிபொருளைப் பகிர்ந்துக்கோங்க.
    back_translation: It's time to go home. Think about which way to go, finish your jobs, and share the fuel with your friend.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: '''Fuel'' kept generic (hi ईंधन, mr इंधन, ta எரிபொருள்) because the vehicle art is not final; once it is, field-test the spoken word (petrol / diesel / तेल / பெட்ரோல்). நண்பர் is gender-neutral and respectful.'
    record: true
    record_note: ''
