  - id: stall.intro
    source_text: Welcome to your stall! Serve your customers, but never serve spoiled food.
    source_hash: 687edadfc078f29f
    status: draft_machine_needs_native_review
    text: வாங்க, இது உங்க கடை! கடைக்கு வர்றவங்களுக்குப் பொருள் கொடுங்க; ஆனா கெட்டுப்போன சாப்பாட்டை எப்பவுமே கொடுக்காதீங்க.
    back_translation: Come, this is your shop! Give goods to the people who come to the shop; but never give spoiled food.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Formal 'welcome' (வரவேற்கிறோம் / நல்வரவு) replaced by the spoken 'Come, this is your shop!'; 'customers' rendered as 'people who come to the shop'.
