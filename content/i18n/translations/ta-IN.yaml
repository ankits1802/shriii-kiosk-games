  - id: report.show_privately
    source_text: Touch the eye to see your summary privately.
    source_hash: 0e75efdbc7fc22b6
    status: draft_machine_needs_native_review
    text: உங்க சுருக்கத்தை நீங்க மட்டும் பார்க்க, கண் படத்தைத் தொடுங்க.
    back_translation: For only you to see your summary, touch the eye picture.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: ''
    record: true
    record_note: ''
    history: []
  - id: report.qr_offer
    source_text: Scan this code to hear your summary again later, or to delete your data.
    source_hash: 6fc3270f9f70c58e
    status: draft_machine_needs_native_review
    text: அப்புறம் உங்க சுருக்கத்தை மறுபடி கேட்கவோ, உங்க தகவலை அழிக்கவோ, இந்தக் கோடை ஃபோன்ல ஸ்கேன் பண்ணுங்க.
    back_translation: To hear your summary again later, or to erase your information, scan this code with a phone.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: '''with a phone'' added for clarity (participants unfamiliar with QR codes); reviewers to confirm the addition. ''Data'' rendered as ''information''.'
    record: true
    record_note: ''
    history: []
  - id: survey.enjoy
    source_text: Did you enjoy the games? Touch a face.
    source_hash: f008797fab71f2aa
    status: draft_machine_needs_native_review
    text: விளையாட்டு உங்களுக்குப் பிடிச்சிருந்ததா? ஒரு முகத்தைத் தொடுங்க.
    back_translation: Did you like the game? Touch a face.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: ''
    record: true
    record_note: ''
    history: []
  - id: survey.play_again
    source_text: Would you play again? Touch the tick or the cross.
    source_hash: 4a5afd9d8ce91198
    status: draft_machine_needs_native_review
    text: மறுபடி விளையாடுவீங்களா? சரி குறியையோ பெருக்கல் குறியையோ தொடுங்க.
    back_translation: Would you play again? Touch the right mark or the X mark.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: ''
    record: true
    record_note: ''
    history: []
  - id: optin.contact.question
    source_text: May we call you in a few weeks to play once more? Touch the tick for yes, or the cross for no.
    source_hash: 4b07ba8a43a54846
    status: draft_machine_needs_native_review
    text: சில வாரம் கழிச்சு, இன்னொரு தடவை விளையாட உங்களுக்கு ஃபோன் பண்ணலாமா? சரின்னா சரி குறியை, வேண்டாம்னா பெருக்கல் குறியைத் தொடுங்க.
    back_translation: After a few weeks, may we phone you to play one more time? If yes, touch the right mark; if not, the X mark.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: Contact opt-in (default no). Must not sound like pressure.
    record: true
    record_note: ''
    history: []
