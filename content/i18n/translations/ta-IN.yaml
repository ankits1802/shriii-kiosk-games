  - id: bands.under_18.goodbye
    source_text: Thank you! This game is for grown-ups. Enjoy the fair!
    source_hash: 7b71bf5835b1f13d
    status: draft_machine_needs_native_review
    text: நன்றி! இந்த விளையாட்டு பெரியவங்களுக்கானது. திருவிழாவை நல்லா அனுபவிங்க!
    back_translation: Thank you! This game is for grown-ups. Enjoy the festival well!
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Must sound kind, not like a refusal; nothing is kept.
    record: true
    record_note: ''
    history: []
  - id: bands.literacy.question
    source_text: Can you read a letter or a newspaper? Easily, with difficulty, or not at all?
    source_hash: c71870f7388a1183
    status: draft_machine_needs_native_review
    text: உங்களால ஒரு கடிதமோ பேப்பரோ படிக்க முடியுமா? சுலபமா, கஷ்டப்பட்டு, இல்லன்னா படிக்கவே முடியாதா?
    back_translation: Can you read a letter or a newspaper? Easily, with difficulty, or not able to read at all?
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: 'Sensitive question: neutral, matter-of-fact delivery with no hint that one answer is better. ''Not at all'' must sound as acceptable as ''easily''.'
    record: true
    record_note: ''
    history: []
  - id: bands.education.question
    source_text: Which picture shows how far you went in school?
    source_hash: 92aebabbd66e3c9b
    status: draft_machine_needs_native_review
    text: நீங்க எதுவரைக்கும் படிச்சீங்கன்னு எந்தப் படம் காட்டுது?
    back_translation: Which picture shows up to what level you studied?
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Must also work for people who never went to school (a 'no schooling' picture exists).
    record: true
    record_note: ''
    history: []
  - id: bands.gender.question
    source_text: Which picture fits you? You can also skip this.
    source_hash: aa4c946a5e2d0af0
    status: draft_machine_needs_native_review
    text: எந்தப் படம் உங்களுக்குப் பொருந்துது? வேணும்னா இதை விட்டுடலாம்.
    back_translation: Which picture suits you? If you want, you can leave this out.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Optional question; the skip must sound genuinely fine. Do not name genders in the audio; the pictures carry the options.
    record: true
    record_note: ''
    history: []
  - id: bands.device_use.question
    source_text: How often do you use a smartphone? Never, sometimes, or every day?
    source_hash: 4f4df00bff306888
    status: draft_machine_needs_native_review
    text: நீங்க ஸ்மார்ட்ஃபோன் எவ்வளவு அடிக்கடி பயன்படுத்துவீங்க? எப்பவுமே இல்ல, எப்பவாவது, இல்லன்னா தினமும்?
    back_translation: How often do you use a smartphone? Never, sometimes, or daily?
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Pictures should show a touch-screen phone so that keypad-phone users answer correctly; 'smartphone' kept as the familiar loanword.
    record: true
    record_note: ''
    history: []
  - id: bands.played_before.question
    source_text: Have you played this game before?
    source_hash: c7b894c7c259e161
    status: draft_machine_needs_native_review
    text: இந்த விளையாட்டை முன்னாடி எப்பவாவது விளையாடியிருக்கீங்களா?
    back_translation: Have you ever played this game before?
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: ''
    record: true
    record_note: ''
    history: []
  - id: bands.prefer_not_to_say
    source_text: I prefer not to say.
    source_hash: 04355f1a238e2069
    status: draft_machine_needs_native_review
    text: சொல்ல விரும்பல.
    back_translation: (I) don't wish to say.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Spoken as the player's own answer option; gender-neutral first-person forms chosen deliberately.
    record: true
    record_note: ''
    history: []
  - id: warmup.intro
    source_text: Let's warm up! First, a few easy taps.
    source_hash: a4cf2a984ddb1dec
    status: draft_machine_needs_native_review
    text: வாங்க, முதல்ல கொஞ்சம் பயிற்சி பண்ணலாம்! ஆரம்பத்துல சில சுலபமான பொருட்களைத் தொட்டா போதும்.
    back_translation: Come, let's practise a bit first! At the start, it's enough to touch some easy things.
    register_note: 'Tone ''encouraging'': Light, upbeat praise; never childish or patronising to adults and elders.'
    translator_note: '''Warm up'' has no natural equivalent; rendered as ''practise a little''. ''Taps'' rendered as touching easy things.'
    record: true
    record_note: ''
    history: []
  - id: warmup.tap
    source_text: Touch the mango when it appears.
    source_hash: 27cda496a60d85c1
    status: draft_machine_needs_native_review
    text: மாம்பழம் வந்தவுடனே அதைத் தொடுங்க.
    back_translation: As soon as the mango comes, touch it.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: ''
    record: true
    record_note: ''
    history: []
  - id: warmup.hold
    source_text: Now touch and hold the jar until it fills.
    source_hash: 5e795bb4d9210548
    status: draft_machine_needs_native_review
    text: இப்போ ஜாடியைத் தொட்டு, அது நிறையுற வரைக்கும் அழுத்திப் பிடிச்சுக்கோங்க.
    back_translation: Now touch the jar and keep holding it pressed until it fills.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: '''Jar'' must match the final art (glass/clay jar). If the art shows a clay pot, use hi मटका / mr मडकं / ta பானை instead and update the glossary.'
    record: true
    record_note: ''
    history: []
  - id: warmup.choice
    source_text: Touch the basket that matches.
    source_hash: fd6e54a28f5d8cf7
    status: draft_machine_needs_native_review
    text: பொருந்துற கூடையைத் தொடுங்க.
    back_translation: Touch the basket that matches.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: ''
    record: true
    record_note: ''
    history: []
  - id: warmup.done
    source_text: Well done. Now let's go to the market!
    source_hash: 9b3a8c29421d0fa9
    status: draft_machine_needs_native_review
    text: ரொம்ப நல்லது! இப்போ சந்தைக்குப் போகலாம், வாங்க!
    back_translation: Very good! Now let's go to the market, come!
    register_note: 'Tone ''encouraging'': Light, upbeat praise; never childish or patronising to adults and elders.'
    translator_note: 'Praise for adults: warm, not childish (avoid hi शाबाश, which can sound like praising a child).'
    record: true
    record_note: ''
    history: []
  - id: dont_tap.intro
    source_text: Fresh fruit only! Serve good fruit quickly, but do not serve spoiled fruit.
    source_hash: 0b8e2c6ae4847261
    status: draft_machine_needs_native_review
    text: புதுப் பழம் மட்டும்தான்! நல்ல பழத்தைச் சீக்கிரமா கொடுங்க; ஆனா கெட்டுப்போன பழத்தைக் கொடுக்காதீங்க.
    back_translation: Only fresh fruit! Give good fruit quickly; but don't give spoiled fruit.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: '''Serve'' rendered as ''give'' (to the customer); the practice trial shows that giving = touching. Speed and the no-go rule must carry equal weight, as in the source.'
    record: true
    record_note: ''
    history: []
  - id: dont_tap.practice
    source_text: Let's try one together.
    source_hash: adf93715f6d76638
    status: draft_machine_needs_native_review
    text: வாங்க, ஒண்ணு சேர்ந்து செஞ்சு பார்க்கலாம்.
    back_translation: Come, let's do one together and see.
    register_note: 'Tone ''encouraging'': Light, upbeat praise; never childish or patronising to adults and elders.'
    translator_note: ''
    record: true
    record_note: ''
    history: []
  - id: dont_tap.outro
    source_text: Thank you! Let's move on.
    source_hash: fd0fbee3cbd726e8
    status: draft_machine_needs_native_review
    text: நன்றி! வாங்க, அடுத்ததுக்குப் போகலாம்.
    back_translation: Thank you! Come, let's go on to the next one.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Shared bridge line (<= 5 s); keep identical wording across modules so one take can be reused.
    record: true
