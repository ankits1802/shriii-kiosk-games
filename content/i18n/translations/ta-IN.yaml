  - id: report.thank_you
    source_text: Thank you for playing at the market fair!
    source_hash: 5dc011c170337b4c
    status: draft_machine_needs_native_review
    text: சந்தைத் திருவிழாவுல விளையாடினதுக்கு நன்றி!
    back_translation: Thanks for playing at the market festival!
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: ''
    record: true
    record_note: ''
    history: []
  - id: report.what_this_is_about
    source_text: These games look at how people make choices and work through tasks. Researchers are still learning from them.
    source_hash: 00c745800a36447e
    status: draft_machine_needs_native_review
    text: மக்கள் எப்படி முடிவு எடுக்குறாங்க, வேலைகளை எப்படிச் செய்யுறாங்கன்னு இந்த விளையாட்டுகள் பார்க்குது. ஆராய்ச்சியாளர்கள் இன்னும் இதிலிருந்து கத்துக்கிட்டு இருக்காங்க.
    back_translation: These games look at how people make decisions and how they do tasks. Researchers are still learning from this.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: ''
    record: true
    record_note: ''
    history: []
  - id: report.disclaimer.snapshot
    source_text: This is a snapshot of how you played today. It is not a test, a diagnosis, or a judgement of you.
    source_hash: 0d4548627a6f84ff
    status: draft_machine_needs_native_review
    text: இன்னைக்கு நீங்க எப்படி விளையாடினீங்கன்னு காட்டுற ஒரு சின்னப் பார்வை மட்டும்தான் இது. இது தேர்வு இல்ல, நோய்ப் பரிசோதனை இல்ல, உங்களைப் பத்தின தீர்ப்பும் இல்ல.
    back_translation: This is only a small view showing how you played today. It is not an exam, not a medical test, and not a judgement about you.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: 'Mandatory disclaimer on every report: all three negations (test, diagnosis, judgement) must survive back-translation.'
    record: true
    record_note: ''
    history: []
  - id: report.intro
    source_text: Here are some things you showed today.
    source_hash: 68aab875bc3dd2c6
    status: draft_machine_needs_native_review
    text: இன்னைக்கு உங்க விளையாட்டுல தெரிஞ்ச சில விஷயங்கள் இதோ.
    back_translation: Here are some things that showed in your play today.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: ''
    record: true
    record_note: ''
    history: []
  - id: report.example_label
    source_text: This is an example, not your own result.
    source_hash: a8ba4807cfe34706
    status: draft_machine_needs_native_review
    text: இது வெறும் ஒரு உதாரணம்தான்; உங்களைப் பத்தினது இல்ல.
    back_translation: This is just an example; it is not about you.
    register_note: 'Tone ''neutral'': Plain, even delivery; no emotional colouring.'
    translator_note: Demo-mode label (think-aloud only). Must be unmistakable. 'Result' (முடிவு) is ambiguous with 'decision'; rendered as 'it is not about you'.
    record: true
