    history: []
  - id: report.initiative.pole_b
    source_text: You often take helpful extra steps without being asked.
    source_hash: f9ba59f7dc43bc9a
    status: draft_machine_needs_native_review
    text: யாரும் கேட்காமலேயே, அடிக்கடி பயனுள்ள கூடுதல் விஷயங்களைச் செய்வீங்க.
    back_translation: Without anyone asking, you often do useful extra things.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: 'Strengths-framed band phrase: must sound positive and non-judgemental; no numbers, no comparison with others.'
    record: true
    record_note: ''
    history: []
  - id: report.risk_preference.pole_a
    source_text: You prefer safe and steady choices.
    source_hash: 24299923ac4b8e67
    status: draft_machine_needs_native_review
    text: பாதுகாப்பான, நிலையான தேர்வுகள்தான் உங்களுக்குப் பிடிக்கும்.
    back_translation: You like safe, steady choices.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: 'Strengths-framed band phrase: must sound positive and non-judgemental; no numbers, no comparison with others.'
    record: true
    record_note: ''
    history: []
  - id: report.risk_preference.centre
    source_text: You balance safe choices with some risks.
    source_hash: 6a9bc6c300f7e671
    status: draft_machine_needs_native_review
    text: பாதுகாப்பான தேர்வுகளையும் செய்வீங்க, அப்பப்போ கொஞ்சம் ரிஸ்க்கும் எடுப்பீங்க.
    back_translation: You make safe choices, and now and then take a little risk too.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: 'Strengths-framed band phrase: must sound positive and non-judgemental; no numbers, no comparison with others.'
    record: true
    record_note: ''
    history: []
  - id: report.risk_preference.pole_b
    source_text: You are willing to take chances for bigger rewards.
    source_hash: d0be60e2663076b0
    status: draft_machine_needs_native_review
    text: பெரிய பலனுக்காக ரிஸ்க் எடுக்க நீங்க தயாரா இருப்பீங்க.
    back_translation: You are ready to take a risk for a bigger reward.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: 'Strengths-framed band phrase: must sound positive and non-judgemental; no numbers, no comparison with others.'
    record: true
    record_note: ''
    history: []
  - id: report.persistence.pole_a
    source_text: You know when to move on to the next thing.
    source_hash: 93572c52cc6a473a
    status: draft_machine_needs_native_review
    text: அடுத்த விஷயத்துக்கு எப்போ போகணும்னு உங்களுக்குத் தெரியும்.
    back_translation: You know when to go on to the next thing.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: 'Strengths-framed band phrase: must sound positive and non-judgemental; no numbers, no comparison with others.'
    record: true
    record_note: ''
    history: []
  - id: report.persistence.centre
    source_text: You keep trying for a good while.
    source_hash: ab0745bdc8a06993
    status: draft_machine_needs_native_review
    text: ரொம்ப நேரம் விடாம முயற்சி பண்ணுவீங்க.
    back_translation: You keep trying for a long time without giving up.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: 'Strengths-framed band phrase: must sound positive and non-judgemental; no numbers, no comparison with others.'
    record: true
    record_note: ''
    history: []
  - id: report.persistence.pole_b
    source_text: You keep trying even when things are hard.
    source_hash: 8ef44385125b5a20
    status: draft_machine_needs_native_review
    text: கஷ்டமா இருந்தாலும், நீங்க முயற்சியை விட மாட்டீங்க.
    back_translation: Even when it's hard, you don't give up trying.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: 'Strengths-framed band phrase: must sound positive and non-judgemental; no numbers, no comparison with others.'
    record: true
