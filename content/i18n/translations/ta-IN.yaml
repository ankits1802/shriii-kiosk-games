  - id: report.response_consistency.pole_a
    source_text: You like to try different ways each time.
    source_hash: f2a34cfd45e0b9c1
    status: draft_machine_needs_native_review
    text: ஒவ்வொரு தடவையும் புது வழியில செஞ்சு பார்க்க உங்களுக்குப் பிடிக்கும்.
