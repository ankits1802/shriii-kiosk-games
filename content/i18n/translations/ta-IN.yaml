  - id: private_dice.intro
    source_text: Roll the dice in your cupped hands. Only you see it. Then touch the picture that matches.
    source_hash: 4cebca380e8d7e05
    status: draft_machine_needs_native_review
    text: உங்க கையைக் குவிச்சு, அதுக்குள்ள பகடையை உருட்டுங்க. அது உங்களுக்கு மட்டும்தான் தெரியும். அப்புறம் பொருந்துற படத்தைத் தொடுங்க.
    back_translation: Cup your hands and roll the dice inside them. Only you can see it. Then touch the matching picture.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Privacy of the roll must be clear and believable (group-level integrity only, MG-06). Dice can carry gambling connotations; see the dice/luck adaptation sheet.
    record: true
