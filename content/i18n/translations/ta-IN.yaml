  - id: share_pot.intro
    source_text: Share tokens in the pot with your helpers. The pot grows and is shared by everyone.
    source_hash: 34ef7bfe50d8989f
    status: draft_machine_needs_native_review
    text: உங்க கூட்டாளிகளோட சேர்ந்து பானையில காசு போடுங்க. பானையில சேர்றது பெருகி, எல்லாருக்கும் பிரிச்சுக் கொடுப்போம்.
    back_translation: Put coins into the pot along with your partners. What collects in the pot grows, and we divide it among everyone.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: '''Tokens'' rendered as coins (the most natural spoken word); the token art must look like generic coins, not real currency. ''Helpers'' rendered as companions/partners. Do not add ''equally''. Passive ''is shared'' rendered with spoken ''we divide it''; reviewers to check this does not imply the guide decides the split.'
    record: true
    record_note: ''
