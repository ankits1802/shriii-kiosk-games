  - id: consent.core.segment_1
    source_text: We will play a few short games at a village market. There are no right or wrong people, only choices.
    source_hash: 606344efea9df472
    status: draft_machine_needs_native_review
    text: हम एक गाँव के बाज़ार में कुछ छोटे-छोटे खेल खेलेंगे। इसमें कोई इंसान सही या गलत नहीं होता, बस अपनी-अपनी पसंद होती है।
    back_translation: We will play some small games at a village market. In this, no person is right or wrong; there are just each person's own choices.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: 'Consent script: meaning must be exact and calm. The source ''no right or wrong people'' means nobody is judged; rendered as ''no person is right or wrong, only one''s own choices''.'
    record: true
    record_note: ''
    history: []
  - id: consent.core.segment_2
    source_text: We keep only your taps and choices, with no name. We never keep your voice or any recording.
    source_hash: b4cdd252dead7546
    status: draft_machine_needs_native_review
    text: हम सिर्फ़ आपके छूने और चुनने की जानकारी रखते हैं, आपका नाम नहीं। आपकी आवाज़ या कोई भी रिकॉर्डिंग हम कभी नहीं रखते।
    back_translation: We keep only information about your touching and choosing, not your name. We never keep your voice or any recording.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: 'Privacy promise (PRV-03): ''never keep your voice'' must stay unconditional; reviewers must not soften it.'
    record: true
    record_note: ''
    history: []
  - id: consent.core.segment_3
    source_text: You can stop at any time by touching the hand. You can also ask us to delete what you played.
    source_hash: b470a591226d26a0
    status: draft_machine_needs_native_review
    text: हाथ वाले निशान को छूकर, खेल कभी भी रोका जा सकता है। आप चाहें, तो आपका खेला हुआ सब हम मिटा भी देंगे।
    back_translation: By touching the hand sign, the game can be stopped at any time. If you wish, we will also erase everything you played.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: 'Withdrawal right (ONB-06): both ''stop any time'' and ''ask us to delete'' must survive back-translation. Passive ''रोका जा सकता है'' avoids the gendered ''रोक सकते/सकती हैं''. Check that ''we will erase'' still conveys that the player must ask (source: ''you can ask us to delete'').'
    record: true
    record_note: ''
    history: []
  - id: consent.core.segment_4
    source_text: At the end you may hear a short picture summary. It is a snapshot of today's play, not a test or a diagnosis.
    source_hash: eed5880d6204d452
    status: draft_machine_needs_native_review
    text: आख़िर में आपको तस्वीरों के साथ थोड़ा-सा बताया जा सकता है कि आपने कैसे खेला। यह सिर्फ़ आज के खेल की एक झलक है, कोई परीक्षा नहीं, और न ही किसी बीमारी की जाँच।
    back_translation: 'At the end you may be told a little, with pictures, about how you played. This is only a glimpse of today''s game: not an exam, and not a check for any illness.'
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: '''Diagnosis'' has no everyday word; rendered as ''a check for illness'' so that non-literate listeners understand it is not medical. ''Summary'' rendered as ''glimpse'' (hi/mr झलक) / ''brief'' (ta சுருக்கம்).'
    record: true
    record_note: ''
    history: []
  - id: consent.core.question
    source_text: If you agree, touch the tick. If not, touch the cross.
    source_hash: d0387b4c0fbc40f1
    status: draft_machine_needs_native_review
    text: अगर आप राज़ी हैं, तो सही का निशान छुइए। अगर नहीं, तो क्रॉस छुइए।
    back_translation: If you agree, touch the right-mark. If not, touch the cross.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: Consent is committed by tap only; the line must not imply that speaking 'yes' is enough.
    record: true
    record_note: ''
    history: []
  - id: consent.archive.question
    source_text: May we keep your anonymous play for future research? Touch the tick for yes, or leave it for no.
    source_hash: fc2941413a233b2f
    status: draft_machine_needs_native_review
    text: क्या हम आपका यह खेल, बिना नाम के, आगे की रिसर्च के लिए रख सकते हैं? हाँ के लिए सही का निशान छुइए; ना हो, तो कुछ मत छुइए।
    back_translation: May we keep this game of yours, without a name, for future research? For yes, touch the right-mark; if no, don't touch anything.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: Default is NO (leave it). 'Anonymous' rendered as 'without (your) name'. रिसर्च is the loanword most people know; शोध/अनुसंधान are bookish. Native review to confirm for rural listeners.
    record: true
    record_note: ''
    history: []
