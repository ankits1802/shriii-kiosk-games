    text: सिर्फ़ ताज़े फल! अच्छे फल जल्दी-जल्दी दीजिए, लेकिन सड़े हुए फल मत दीजिए।
    back_translation: Only fresh fruits! Give good fruits quickly, but do not give rotten fruits.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
