  - id: stall.customer.hostile
    source_text: Hurry up! Why is this taking so long?
    source_hash: 54db199a259d367a
    status: draft_machine_needs_native_review
    text: जल्दी करो! इतनी देर क्यों लग रही है?
    back_translation: Do it quickly! Why is it taking so long?
    register_note: 'Tone ''hostile'': Recorded STIMULUS (rude customer). Impatient and sharp in tone only; no insults, abuse, caste, religion or gender references. Rudeness intensity must be matched across languages (see adaptation sheet customer-rudeness).'
    translator_note: 'Hostile customer STIMULUS (tone level 3-4). Rude through impatience and tone only: no insults or identity references. Rudeness intensity must be matched across languages by the voice director (customer-rudeness adaptation sheet). Familiar करो (instead of polite कीजिए) deliberately signals rudeness without any insult.'
    record: true
