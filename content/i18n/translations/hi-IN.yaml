  - id: private_dice.intro
    source_text: Roll the dice in your cupped hands. Only you see it. Then touch the picture that matches.
    source_hash: 4cebca380e8d7e05
    status: draft_machine_needs_native_review
    text: पासे को अपनी जुड़ी हुई हथेलियों में हिलाइए। उसे सिर्फ़ आप देखेंगे। फिर जो तस्वीर उससे मेल खाए, उसे छुइए।
    back_translation: Shake the dice in your joined palms. Only you will see it. Then touch the picture that matches it.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Privacy of the roll must be clear and believable (group-level integrity only, MG-06). Dice can carry gambling connotations; see the dice/luck adaptation sheet. 'Only you will see' uses future देखेंगे, which is masculine/generic; reviewers may prefer the neutral 'उसे सिर्फ़ आपको दिखेगा'.
