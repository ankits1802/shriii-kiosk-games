    back_translation: Namaste! Please give me two good mangoes.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Customer voice (stimulus, tone level 0-1). The number of mangoes is spoken and shown as two pictured mangoes; no digits.
