  - id: weighing_post.quantity_prefix
    source_text: 'The needle shows:'
    source_hash: 52041152c063d6fa
    status: draft_machine_needs_native_review
    text: 'सुई बता रही है:'
    back_translation: 'The needle is telling:'
    register_note: 'Tone ''neutral'': Plain, even delivery; no emotional colouring.'
    translator_note: 'Concatenated before a spoken quantity clip. Hindi and Marathi are verb-final, so ''needle shows: five kilo'' is a spoken right-dislocation; acceptable in speech but should be checked. Tamil uses a nominalised form that works as a prefix. Alternative: record whole sentences per quantity.'
    record: true
