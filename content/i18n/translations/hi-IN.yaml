  - id: tower.skip_hint
    source_text: If you think it cannot be done, you may touch the arrow to skip.
    source_hash: 11b5d34038a8df56
    status: draft_machine_needs_native_review
    text: अगर लगे कि यह नहीं हो सकता, तो चाहें तो तीर को छूकर आगे बढ़ जाइए।
    back_translation: If you feel this cannot be done, then if you wish, touch the arrow and move ahead.
    register_note: 'Tone ''calm'': Slow, steady and reassuring; consent and privacy lines must never sound rushed or legalistic.'
    translator_note: 'Persistence measure (time on unsolvable items): the hint must stay neutral, neither encouraging nor discouraging skipping, and must not reveal that some puzzles are unsolvable.'
    record: true
    record_note: ''
