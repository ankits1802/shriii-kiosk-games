  - id: dont_tap.pressure_cue
    source_text: The crowd is here! Serve fast, but only good fruit.
    source_hash: 29a14239435307f9
    status: draft_machine_needs_native_review
    text: भीड़ आ गई! जल्दी दीजिए, पर सिर्फ़ अच्छे फल।
    back_translation: The crowd has come! Give quickly, but only good fruit.
    register_note: 'Tone ''urgent'': Brisk and energetic but friendly; excitement of a busy market, not alarm.'
    translator_note: 'Announced pressure block: energetic, not alarming. The ''only good fruit'' rule must stay as prominent as ''fast''.'
    record: true
    record_note: ''
