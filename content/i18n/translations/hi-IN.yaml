  - id: bands.literacy.question
    source_text: Can you read a letter or a newspaper? Easily, with difficulty, or not at all?
    source_hash: c71870f7388a1183
    status: draft_machine_needs_native_review
    text: चिट्ठी या अख़बार पढ़ना आपको आता है? आसानी से, मुश्किल से, या बिल्कुल नहीं?
    back_translation: Do you know how to read a letter or a newspaper? Easily, with difficulty, or not at all?
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: 'Sensitive question: neutral, matter-of-fact delivery with no hint that one answer is better. ''Not at all'' must sound as acceptable as ''easily''. ''पढ़ना आपको आता है'' is gender-neutral (avoids पढ़ लेते/लेती हैं).'
    record: true
    record_note: ''
    history: []
  - id: bands.education.question
    source_text: Which picture shows how far you went in school?
    source_hash: 92aebabbd66e3c9b
    status: draft_machine_needs_native_review
    text: कौन-सी तस्वीर बताती है कि आपने कहाँ तक पढ़ाई की है?
    back_translation: Which picture tells how far you have studied?
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
    translator_note: Must also work for people who never went to school (a 'no schooling' picture exists). 'स्कूल' dropped so that the line also covers college and no schooling; gender-neutral ergative 'आपने ... पढ़ाई की है'. Reviewers to confirm the omission is acceptable.
    record: true
    record_note: ''
    history: []
  - id: bands.gender.question
    source_text: Which picture fits you? You can also skip this.
    source_hash: aa4c946a5e2d0af0
    status: draft_machine_needs_native_review
    text: कौन-सी तस्वीर आप पर ठीक बैठती है? चाहें, तो यह सवाल छोड़ा भी जा सकता है।
    back_translation: Which picture fits you? If you wish, this question can also be left out.
    register_note: 'Tone ''warm'': Friendly, smiling guide voice; unhurried, like a kind neighbour at the fair.'
