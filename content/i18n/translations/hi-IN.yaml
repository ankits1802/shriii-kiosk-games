    status: draft_machine_needs_native_review
    text: क्या हम कुछ हफ़्तों बाद आपको फ़ोन करके एक बार और खेलने के लिए बुला सकते हैं? हाँ के लिए सही का निशान, ना के लिए क्रॉस छुइए।
    back_translation: May we phone you after a few weeks and invite you to play once more? For yes touch the right-mark, for no the cross.
