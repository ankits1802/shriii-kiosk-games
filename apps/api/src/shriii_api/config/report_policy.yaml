# Player-report policy (layer 5) applied on top of scoring/gates.yaml. It can only withhold more, never
# show more: the gates.yaml display rule, caps and permanent withholds still apply in full.
#
# Entries use the gates.yaml `permanent_withhold` shape ({construct, pathway, reason}); pathway "*" means
# every pathway. A withheld construct is never shown in a player report and its phrases are left out of
# the release-pack phrase allowlist (so a kiosk cannot render it either), whatever its trait-gate status.
schema: shriii-report-policy
version: 1.0.0
withhold_from_player_report:
  - construct: integrity
    pathway: "*"
    reason: >-
      BUILD_DECISIONS non-negotiable 6 - private-report integrity is group level only and no player report
      may suggest that an individual is more or less honest. Integrity evidence stays research-only
      (Weighing Post indicators in validation analyses; dice estimators at group level only).
