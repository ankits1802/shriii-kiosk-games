# Alembic configuration for the SHRIII API.
#   research DB:      uv run alembic -c backend/api/alembic.ini upgrade head
#   identity vault:   uv run alembic -c backend/api/alembic.ini -n identity upgrade head
# The database URLs come from DATABASE_URL / IDENTITY_DATABASE_URL (see shriii_api.settings).

[alembic]
script_location = %(here)s/src/shriii_api/migrations
prepend_sys_path = .
path_separator = os
version_table_schema = public

[identity]
script_location = %(here)s/src/shriii_api/migrations_identity
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
