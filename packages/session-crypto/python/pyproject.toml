[project]
name = "shriii-session-crypto"
version = "0.1.0"
description = "Reference decryptor for SHRIII kiosk session chunks (RFC 9180 HPKE sealed DEK + AES-256-GCM gzip NDJSON)"
requires-python = ">=3.13"
dependencies = ["cryptography>=44"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shriii_session_crypto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
