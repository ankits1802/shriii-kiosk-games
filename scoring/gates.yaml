# SHRIII gate rules (VAL-14, plan section 7.7). Frozen in the pre-registration with hypotheses.yaml.
# Fail closed: a missing, expired or unreachable input means the gate stays closed / no report.
# Thresholds are research thresholds, not automatic validity declarations, and change only by amendment.
schema_version: "1.0"
gates_id: shriii-gates
version: 0.1.0
status: draft
frozen_at: null
sha256: null
governance_record: null
fail_closed: true

# A. Battery release gate, per (language, pathway, site_mode). Opens only if ALL hold.
battery_gate:
  scope: [language, pathway, site_mode]
  min_language_groups: 2                 # A1: this language plus >= 1 other each meet A2 and A3
  tier1_reliability_share_min: 0.50      # A2: share of the pathway's Tier-1 constructs meeting trait rules B1 and B2
  count_withheld_as_fail: true
  require_criterion_invariance: true     # A3: VAL-08a criterion-scale invariance passes
  require_no_unresolved_large_dif: true  # A3: VAL-08/VAL-09 for retained indicators
  differential_exclusion_max_pp: 5.0     # A3: max difference in exclusion rate between required groups (percentage points)
  open_public_requires_mode_equivalence: true   # A4: VAL-18 must pass for open_public
  signoff_roles: [pi_or_research_lead, ethics_officer]   # A5: PLT-09 sign-off
  closed_behaviour: thank_you_only

# B. Trait gate, per (trait, language, pathway). `validated_banded` needs all of these.
trait_gate:
  retest:                                # B1
    statistic: icc_a1
    point_min: 0.60                      # configurable research target
    lower_bound_min: 0.40
    ci_level: 0.95
    pooled_language_point_min: 0.50      # pooled across languages only where invariance holds
    min_pairs_per_cell: 30
    pearson_allowed: false
  reliability:                           # B2: composite reliability by method
    point_min: 0.70
    lower_bound_min: 0.60
    ci_level: 0.95
  convergent:                            # B3: observed r only
    observed_only: true
    lower_bound_gt: 0.10
    correction: holm
    require_correct_sign: true
    require_pattern_own_gt_discriminant: true
    upper_bound: null
  invariance:                            # B4
    required_groupings: [language, literacy, education, age_band, gender, device_familiarity, input_mode, variant_form, timing_profile, site_mode]
    max_freed_parameter_share: 0.20
    small_group_n: 200                   # below this, Bayesian approximate invariance / moderated MIMIC
  norms:                                 # B5
    required: provisional_or_final
    sem_rule:                            # "not enough to say"
      ci_level: 0.90
      max_band_boundaries_overlapped: 1  # SEM-based 90% CI overlapping more than one band boundary -> not enough to say
      min_band_width_sem: 2.0            # bands narrower than 2 SEM -> not enough to say
  min_named_signers: 2                   # B6

# C. Other rules
caps:
  - { construct: integrity, max_status: validated_broad_style, stricter_flag: true, reason: Restricted construct; dice is group level only and never shown. }
  - { construct: risk_preference, max_status: validated_broad_style, stricter_flag: true, reason: Restricted construct. }
  - { construct: teamwork, max_status: validated_broad_style, stricter_flag: false, reason: Provisional criterion exception until partner-rating evidence passes. }
  - { construct: response_consistency, max_status: validated_broad_style, stricter_flag: false, reason: Style construct (repeated-measure property); design decision. }
  - { construct: persistence_of_style, max_status: validated_broad_style, stricter_flag: false, reason: Style construct (repeated-measure property); design decision. }
  - { construct: stability, max_status: validated_broad_style, stricter_flag: false, reason: Style construct (repeated-measure property); design decision. }

permanent_withhold:
  - { construct: emotional_regulation, pathway: B, reason: No provocation paradigm fits the Pathway B module budget. }
  - { construct: judgement, pathway: B, reason: No credit/blame paradigm in Pathway B. }

group_only_indicators:
  - integrity.dice_overreport_rate
  - integrity.report_distribution_skew
  - integrity.luck_token_overreport_rate

rules:
  disattenuated_feeds_gates: false
  regressions_reclose_gates: true
  evaluate_only_can_promote: false
  thresholds_change_by_amendment_only: true

# Show a trait iff ALL of these hold (REP-01/REP-03).
display_rule:
  battery_gate: open
  trait_status_in: [validated_banded, validated_broad_style]
  session_valid_for_report: true
  exclude_not_enough_to_say: true
  release_pack_valid_and_unexpired: true
  report_mode: player_report

report:
  band_count: 3
  min_traits_shown: 0        # thank-you only when nothing qualifies
  max_traits_shown: 5        # the 3-5 most reliable released traits
  disclaimer_required: true

release_pack:
  default_expiry_days: 14

reliability_methods:          # plan section 7.6
  raw: split_half_permutation
  difference_slope: model_based_slope
  model_parameter: model_based
  composite: composite_omega
  group_only: not_computed
  single_event_unscorable: not_computed

quality:
  floor_ceiling_flag_share: 0.15   # VAL-03
  criterion_omega_min: 0.60        # VAL-04
  practice_effect_d_flag: 0.30     # VAL-05
  fairness_cell_min_n: 30          # VAL-16 suppression
  split_half_permutations: 5000    # VAL-04

asr_policy:                        # VOX-06
  min_accuracy: 0.90
  snr_db: 10
  max_group_gap_pp: 5
  min_heldout_speakers: 30

stage_exits:
  think_aloud:                     # plan section 7.3
    max_reading_dependent_screens: 0
    max_digit_dependent_decisions: 0
    max_unresolved_misunderstood_share: 0.20
    onboarding_median_max_s: 90
    report_comprehension_min: 0.80
  stage2_allows_drops: false       # Stage 2 exit: provisional flags only
