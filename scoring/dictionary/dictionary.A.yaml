# SHRIII scoring dictionary — Pathway A indicators (SCR-01). Layer 2: behavioural indicators.
# Status: v0 draft. min_valid_trials with basis val02_pending are placeholders until the VAL-02 power
# and trial-budget report; plan_ac values come from plan acceptance criteria.
# Pseudo-modules: cross_module / cross_episode indicators pool probe segments or trials across modules.
# Indicator ids shared between pathways denote the same paradigm logic (EPI-05: shared IDs).
schema_version: '1.0'
document: pathway
dictionary_id: shriii-scoring
pathway: A
shared_version: 0.1.0
version: 0.1.0
status: draft
frozen_at: null
sha256: null
governance_record: null
modules:
- id: stall
  kind: episode
  config: content/games/pathway-a/stall.json
  slot: false
  order: 1
- id: weighing_post
  kind: episode
  config: content/games/pathway-a/weighing-post.json
  slot: false
  order: 2
- id: road_home
  kind: episode
  config: content/games/pathway-a/road-home.json
  slot: false
  order: 3
- id: coplay
  kind: episode
  config: content/games/pathway-a/coplay.json
  slot: false
  order: 4
indicators:
- id: self_control.nogo_commission_rate
  construct: self_control
  role: primary
  tier: 1
  status: provisional
  kind: raw
  source:
    module_id: stall
    episode_id: stall
    task: stall.dont_serve
    phases:
    - main
    - pressure
    - shift_post
    slot: false
  event_inputs:
  - trial_start
  - stimulus_onset
  - response
  - trial_end
  required_fields:
  - payload.response_value
  - payload.correctness
  - payload.input_mode
  - condition.phase
  - timing.scorable
  formula:
    ref: gng.commission_rate
    description: Proportion of no-go items (spoiled or out-of-turn) that were served.
  unit: proportion
  direction: higher_less
  transformation: logit_corrected
  aggregation: proportion
  reliability_method: split_half_permutation
  level_rule: fixed_level_only
  min_valid_trials:
    count: 8
    unit: nogo_trials
    basis: plan_ac
  exclusions:
  - not_scorable
  - invalid_placeholder
  - interrupted_trial
  - session_quality_exclude
  - synthetic_session
  - level_not_fixed_l2
  missing_data: insufficient_trials_na
  group_only: false
  gate_eligible: true
  timing_sensitive: false
  sensitivity: standard
  expected_r_lower_bound: 0.1
  convergent_criteria:
  - bscs.total
  - bfi2_xs.conscientiousness
  notes: null
