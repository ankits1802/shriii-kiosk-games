[project]
name = "shriii-timing-calibration"
version = "0.1.0"
description = "SHRIII per-SKU timing calibration (ENG-01/ENG-02): photodiode, solenoid tapper / high-speed camera, audio loopback and rAF frame-time analysis producing a versioned timing_profile JSON."
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.2",
  "PyYAML>=6",
  "jsonschema>=4.23",
]

[project.scripts]
shriii-timing = "shriii_timing.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "mypy>=1.18", "types-PyYAML", "types-jsonschema"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shriii_timing"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT", "C4", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "PT018"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
