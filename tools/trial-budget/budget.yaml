# tools/trial-budget configuration (SCR-03 trial-time budget sheet, ONB-08 session budget check).
#
# This file holds NO scientific thresholds. Budgets come from content/games/session-plan.json and the
# plan section 4.4 table; required trials per indicator come from scoring/dictionary/dictionary.{A,B}.yaml
# (`min_valid_trials`, fed by VAL-02). This file only says how to read them:
#   * which plan section 4.4 rows correspond to which session-plan segment keys;
#   * how many trials the schedule *guarantees* for each dictionary task (the "supply"), expressed as
#     terms over the game configs (block minimums, `min_counts` keys, probe segments, context shifts).
#
# Supply terms (summed; only terms whose module is in the session form count):
#   {module: m, blocks: [b, ...]}             sum of the blocks' `min_trials` (protected minimums)
#   {module: m, count: key, times: n}         `min_counts[key]` x n (times defaults to 1)
#   {module: m, count: key, times_count: k}   `min_counts[key]` x `min_counts[k]`
#   {module: m, count: key, minus_count: k}   `min_counts[key]` - `min_counts[k]`
#   {module: m, probe_segments: true}         floor(probe block min_trials / min_trials_per_segment)
#   {module: m, context_shift: true}          1 if the config declares a context shift
#   {module: m, beat_blocks: beat}            number of blocks scheduling that beat (one scripted event each)
# `behaviour_dependent: true` marks supply that depends on what the player does (reported, never failed).

plan_section_4_4:
  heading: "### 4.4 Session time budgets"
  rows:
    "Language + consent + bands": onboarding
    "Practice + warm-up": practice_warmup
    "Hub bridges": bridges
    "Report or thank-you": report_survey
    "Contact opt-in": contact_optin
  scored_row: "Scored play"
  total_row: "Total"
  # Plan section 4.4 scored-play figures are "design targets"; outside them by more than this is a warning.
  design_target_tolerance_s: 30

# Where the probe-segment length used by the scoring engine lives (read, never copied).
segment_param:
  file: python/shriii_scoring/src/shriii_scoring/data/scoring_params.yaml
  path: [style, min_trials_per_segment]

# Shortfalls on these `min_valid_trials.basis` values fail; other bases (val02_pending placeholders) warn.
blocking_bases: [plan_ac, literature_prior]
# Indicator statuses for which a shortfall is acceptable (SCR-03: demoted or withheld).
demoted_statuses: [research_only, withheld, retired]

# Known shortfalls accepted temporarily. Each entry needs a reason and an owner; the table marks them WAIVED.
# Remove an entry as soon as the content or dictionary is fixed.
waivers:
  B:
    self_control.choice_consistency:
      reason: >-
        dictionary.B requires 12 delay choices (plan_ac) but wait_or_now schedules 8 delay trials
        (12 choices only when the 4 effort choices are added, which discounting.choice_consistency does not
        use). Fix by adding delay trials or demoting the indicator (SCR-03).
      owner: scoring-dictionary

levels: [L1, L2, L3]

supply:
  B:
    dont_tap.gng:
      trials: [{module: dont_tap, blocks: [main, pressure]}]
      nogo_trials: [{module: dont_tap, count: nogo}]
    dont_tap.pressure_block:
      trials: [{module: dont_tap, blocks: [main, pressure]}]
    card_sort.switch:
      post_switch_trials: [{module: card_sort, count: post_switch_per_switch, times_count: switches}]
    balloon.pumping:
      balloons: [{module: balloon, count: balloons}]
    balloon.collect:
      balloons: [{module: balloon, count: balloons}]
    balloon.post_explosion:
      events:
        - {module: balloon, count: balloons, minus_count: non_exploded, behaviour_dependent: true}
    tower.solvable:
      problems: [{module: tower, count: solvable}]
    tower.unsolvable:
      unsolvable_items: [{module: tower, count: unsolvable}]
    tower.post_failure:
      events: [{module: tower, count: unsolvable}]
    share_pot.rounds:
      rounds: [{module: share_pot, count: rounds}]
    share_pot.contribution:
      rounds: [{module: share_pot, count: rounds}]
    share_pot.free_rider_rounds:
      rounds: [{module: share_pot, count: free_rider_rounds}]
    share_pot.error_round:
      events: [{module: share_pot, count: error_rounds}]
    share_pot.unfair_loss_probe:
      events: [{module: share_pot, blocks: [tone_probe]}]
    wait_or_now.delay:
      choices: [{module: wait_or_now, blocks: [delay]}]
    wait_or_now.effort:
      choices: [{module: wait_or_now, count: effort_choices}]
    steady_hands.distractors:
      trials: [{module: steady_hands, blocks: [free, held]}]
    steady_hands.blocks:
      trials: [{module: steady_hands, blocks: [free, held]}]
    four_stalls.choices:
      trials: [{module: four_stalls, blocks: [choices]}]
    four_stalls.repeats:
      trials: [{module: four_stalls, count: repeat_probes}]
    private_dice.reports:
      reports: [{module: private_dice, count: reports}]
    cross_module.rt_trials:
      trials:
        - {module: dont_tap, count: go}
        - {module: card_sort, blocks: [initial_rule, switch_1, reversal]}
        - {module: steady_hands, blocks: [free, held]}
        - {module: four_stalls, blocks: [choices]}
    cross_module.probe_segments:
      segments:
        - {module: dont_tap, probe_segments: true}
        - {module: card_sort, probe_segments: true}
        - {module: balloon, probe_segments: true}
        - {module: tower, probe_segments: true}
        - {module: share_pot, probe_segments: true}
        - {module: wait_or_now, probe_segments: true}
        - {module: steady_hands, probe_segments: true}
        - {module: four_stalls, probe_segments: true}
        - {module: private_dice, probe_segments: true}
    cross_module.context_shifts:
      events:
        - {module: card_sort, count: switches}
        - {module: dont_tap, context_shift: true}
  A:
    stall.dont_serve:
      trials: [{module: stall, blocks: [service, timed_rush]}]
      nogo_trials: [{module: stall, count: nogo}]
    stall.timed_rush:
      trials: [{module: stall, blocks: [service, timed_rush]}]
    stall.feedback_recovery:
      events: [{module: stall, count: feedback_events}]
    stall.tone_choices:
      choices: [{module: stall, count: tone_choices}]
    stall.rude_run:
      events: [{module: stall, count: provocations}]
    weighing_post.decisions:
      decisions: [{module: weighing_post, count: decisions}]
    weighing_post.new_rule:
      post_switch_trials: [{module: weighing_post, count: post_shift}]
    weighing_post.bribe:
      dilemmas: [{module: weighing_post, count: bribe}]
    weighing_post.overpayment:
      dilemmas: [{module: weighing_post, count: overpayment}]
    weighing_post.assistant_mistake:
      dilemmas: [{module: weighing_post, count: assistant_mistake}]
    weighing_post.fraud_found:
      dilemmas: [{module: weighing_post, count: fraud_found}]
    weighing_post.dilemmas:
      dilemmas:
        - {module: weighing_post, count: assistant_mistake}
        - {module: weighing_post, count: fraud_found}
    weighing_post.gamble_inspection:
      decisions: [{module: weighing_post, blocks: [gamble]}]
    weighing_post.luck_tokens:
      reports: [{module: weighing_post, blocks: [luck_tokens]}]
    road_home.errands:
      maps: [{module: road_home, count: maps}]
    road_home.resource_planning:
      maps: [{module: road_home, count: maps}]
    road_home.route_planning:
      maps: [{module: road_home, count: maps}]
    road_home.optional:
      events: [{module: road_home, count: optional_opportunities}]
    road_home.blocked_route:
      events: [{module: road_home, count: blocked_events}]
    road_home.reversal:
      post_switch_trials: [{module: road_home, count: post_reversal}]
    road_home.fuel_pot:
      rounds: [{module: road_home, count: fuel_rounds}]
    road_home.partner_error:
      events: [{module: road_home, beat_blocks: partner_error}]
    road_home.uphill_effort:
      choices: [{module: road_home, count: effort_holds}]
    coplay.turn_taking:
      turns: [{module: coplay, count: turns}]
    coplay.credit_round:
      events: [{module: coplay, count: credit_rounds}]
    cross_episode.rt_trials:
      trials:
        - {module: stall, blocks: [service, timed_rush]}
        - {module: weighing_post, blocks: [decisions_pre, decisions_post]}
        - {module: road_home, blocks: [errand_maps, reversal]}
    cross_episode.probes:
      trials:
        - {module: stall, blocks: [probe]}
        - {module: weighing_post, blocks: [probe]}
        - {module: road_home, blocks: [probe]}
    cross_episode.probe_segments:
      segments:
        - {module: stall, probe_segments: true}
        - {module: weighing_post, probe_segments: true}
        - {module: road_home, probe_segments: true}
    cross_episode.context_shifts:
      events:
        - {module: stall, context_shift: true}
        - {module: weighing_post, context_shift: true}
        - {module: road_home, context_shift: true}
