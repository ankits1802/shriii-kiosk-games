[project]
name = "shriii-provision"
version = "0.1.0"
description = "SHRIII kiosk provisioning CLI (KSK-09, KSK-10, PRV-07): register a kiosk with the API, mint step-ca enrolment tokens, enrol the device certificate, write the device config, verify health, render and validate the Ubuntu Core model and wave-freeze validation-set assertions."
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28",
  "cryptography>=44",
  "PyJWT>=2.10",
]

[project.scripts]
shriii-provision = "shriii_provision.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "mypy>=1.18"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shriii_provision"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT", "C4", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "PT018"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
