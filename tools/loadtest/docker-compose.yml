# Dedicated PostgreSQL 18 for load tests. It has its own Compose project name, volume and port, so a
# load run never touches the developer database from the root docker-compose.yml.
#   docker compose -f tools/loadtest/docker-compose.yml up -d --wait
#   docker compose -f tools/loadtest/docker-compose.yml down -v      # drop all load-test data
name: shriii-loadtest

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: shriii_load
      POSTGRES_USER: load
      POSTGRES_PASSWORD: load
      TZ: UTC
      PGTZ: UTC
    # Modest settings for a small managed instance (2 vCPU / 4-8 GB). Change them here, never in the
    # API, so results stay comparable between runs. pg_stat_statements feeds the bottleneck report.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - track_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    shm_size: 1g
    ports:
      - "${LOADTEST_PG_PORT:-55442}:5432"
    volumes:
      - loadpg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U load -d shriii_load"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  loadpg:
