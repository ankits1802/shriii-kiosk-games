# Pass/fail targets for load runs. Plan-derived targets cite their feature ID; anything marked
# "proposed" is a working SLO from this harness and needs sign-off before it gates anything.
version: 1

ingestion:
  # ING-02 AC: "p95 < 300 ms for a 500-event batch with 50 kiosks".
  source: docs/IMPLEMENTATION_PLAN.md#ING-02
  batch_events: 500
  kiosks: 50
  p95_ms: 300
  # ING-02 AC: "20 parallel clients and replayed batches produce zero duplicates, including when a
  # kiosk clock is set to 1970 or drifts by +3 days".
  duplicate_rows: 0
  # ING-02 AC: "Events split across batches with consent arriving second are accepted after unparking".
  still_parked_after_run: 0
  # A batch that fails terminally (non-retryable 4xx) loses data from the kiosk's point of view.
  terminal_failures: 0

research_api:
  status: proposed
  # Interactive dashboard reads while ingestion is running.
  p95_ms: 800
  error_rate: 0.0

reconnect:
  status: proposed
  # 50 kiosks returning after a day offline should have drained their outboxes within this time.
  drain_s: 300
