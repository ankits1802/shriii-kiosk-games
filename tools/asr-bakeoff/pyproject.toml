[project]
name = "shriii-asr-bakeoff"
version = "0.1.0"
description = "SHRIII closed-vocabulary ASR bake-off harness (VOX-06): engines x languages x SNR, false accepts, latency, CPU, subgroup fairness, policy verdicts and language-pack ASR configs."
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.2",
  "PyYAML>=6",
  "jsonschema>=4.23",
  "referencing>=0.36",
  "psutil>=6",
]

[project.optional-dependencies]
# Real engines. Installed by default in the dev group so the harness can run them when models exist.
# sherpa-onnx-core (the native libonnxruntime / sherpa libraries) is listed explicitly: every sherpa-onnx wheel
# requires it except the linux_armv7l one, and uv's universal lock takes that wheel's metadata, so without
# this entry the lock drops it and `import sherpa_onnx` fails on x86-64 Linux. Keep both on the same version.
engines = ["sherpa-onnx>=1.13.8", "sherpa-onnx-core>=1.13.8", "onnxruntime>=1.22", "sentencepiece>=0.2"]

[project.scripts]
shriii-asr-bakeoff = "shriii_asr_bakeoff.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.14",
  "mypy>=1.18",
  "types-PyYAML",
  "types-psutil",
  "sherpa-onnx>=1.13.8",
  "sherpa-onnx-core>=1.13.8",
  "onnxruntime>=1.22",
  "sentencepiece>=0.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shriii_asr_bakeoff"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = ["real_model: needs downloaded models (skipped when absent)"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT", "C4", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "PT018", "N803", "N806"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sherpa_onnx.*", "onnxruntime.*", "sentencepiece.*", "jsonschema.*", "referencing.*"]
ignore_missing_imports = true
