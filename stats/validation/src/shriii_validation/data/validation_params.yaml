# SHRIII validation-engine parameters that are not (yet) in stats/measurement-model/gates.yaml or stats/measurement-model/hypotheses.yaml.
# Gate thresholds are always read from stats/measurement-model/gates.yaml; these are analysis conventions with citations.
# Candidates for promotion into gates.yaml at the next amendment (status: draft).
schema: shriii-validation-params
version: 0.1.0
status: draft

invariance:
  # Chen (2007) / Cheung & Rensvold (2002) change-in-fit criteria for nested invariance steps.
  delta_cfi_max_drop: 0.010
  delta_rmsea_max_increase: 0.015
  delta_srmr_metric_max: 0.030
  delta_srmr_scalar_max: 0.010

dif:
  # Logistic-regression DIF effect-size classification on Nagelkerke delta R^2.
  zumbo_thomas: {moderate: 0.13, large: 0.26}
  jodoin_gierl: {moderate: 0.035, large: 0.070}
  purification_max_iter: 10
  fdr_alpha: 0.05

structure:
  redundancy_r: 0.85               # |r| at or above this flags two indicators as redundant
  redundancy_disattenuated: 0.95
  cross_loading_min: 0.30          # |loading| at or above this counts as a salient loading
  parallel_analysis_quantile: 0.95
  parallel_analysis_iterations: 200
  min_indicators_for_cfa: 3        # VAL-07 AC: CFA refused for constructs with fewer than 3 indicators

prediction:
  min_n: 100                       # VAL-10 AC: incremental validity refuses to run below the pre-declared n
  outer_folds: 5
  inner_folds: 3
  bootstrap_resamples: 1000

norming:
  provisional_effective_n: 200     # cells with effective n below this are provisional
  min_cell_n: 30                   # cells below this are not published
  weight_trim_ratio: 5.0           # weights trimmed at this multiple of the median weight
  percentiles: [5, 10, 25, 50, 75, 90, 95]

fairness:
  tost_bound_d: 0.20               # default equivalence bound in SD units when none is supplied
  calibration_bins: 10
