[project]
name = "shriii-prereg"
version = "0.1.0"
description = "Generates the OSF-style pre-registration document (Markdown + HTML) from stats/measurement-model/hypotheses.yaml, gates.yaml and the scoring dictionary (CRT-11)"
requires-python = ">=3.13"
dependencies = [
  "shriii-scoring",
  "shriii-validation",
  "jinja2>=3.1",
  "pyyaml>=6",
]

[project.scripts]
shriii-prereg = "shriii_prereg.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shriii_prereg"

[tool.uv.sources]
shriii-scoring = { workspace = true }
shriii-validation = { workspace = true }
