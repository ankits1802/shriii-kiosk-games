[project]
name = "shriii-rbridge"
version = "0.1.0"
description = "RBackend implementation that runs the shriiipsy R package (Docker image or local Rscript)"
requires-python = ">=3.13"
dependencies = [
  "shriii-validation",
  "numpy>=2.3",
  "pandas>=2.3",
  "pyarrow>=21",
  "pyyaml>=6",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shriii_rbridge"

[tool.uv.sources]
shriii-validation = { workspace = true }
