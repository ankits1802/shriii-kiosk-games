# SHRIII scoring dictionary — Pathway B indicators (SCR-01). Layer 2: behavioural indicators.
# Status: v0 draft. min_valid_trials with basis val02_pending are placeholders until the VAL-02 power
# and trial-budget report; plan_ac values come from plan acceptance criteria.
# Pseudo-modules: cross_module / cross_episode indicators pool probe segments or trials across modules.
# Indicator ids shared between pathways denote the same paradigm logic (EPI-05: shared IDs).
