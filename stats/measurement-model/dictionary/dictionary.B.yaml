- id: persistence.effort_completion_rate
  construct: persistence
  role: secondary
  tier: 1
  status: provisional
  kind: raw
  source:
    module_id: wait_or_now
    episode_id: null
    task: wait_or_now.effort
    phases:
    - main
    slot: true
  event_inputs:
  - input.hold
  - trial_end
  required_fields:
  - payload.completed
  - payload.hold_ms
  formula:
    ref: effort.completion_rate
    description: Proportion of chosen effortful holds completed.
  unit: proportion
  direction: higher_more
  transformation: logit_corrected
  aggregation: proportion
  reliability_method: split_half_permutation
  level_rule: fixed_level_only
  min_valid_trials:
    count: 4
    unit: choices
    basis: val02_pending
  exclusions:
  - not_scorable
  - invalid_placeholder
  - interrupted_trial
  - session_quality_exclude
  - synthetic_session
  - level_not_fixed_l2
  missing_data: planned_missing_slot
  group_only: false
  gate_eligible: false
  timing_sensitive: false
  sensitivity: standard
  expected_r_lower_bound: 0.1
  convergent_criteria:
  - grit_s.total
  notes: >-
    not_scorable_v1: Wait-or-Now offers a hold only after a 'hard' choice, so the number of completion
    opportunities is behaviour-dependent (median 3 of 4 in simulation, 0 for steep effort discounters) and
    never reliably reaches the 4-choice minimum; the count that is observed is confounded with effort
    discounting. Not gate-eligible in v1. Pathway A (Road Home uphill, 4 forced holds) carries the paradigm.
    Fix for v2: forced-hold trials in Wait-or-Now (proposal in docs/science/indicator-review.md).
    Amendment 2026-10-wave2 (A4): stays not_scorable_v1; the 8-trial effort staircase (indicator review section
    4) does not fit the session ceiling (slow estimate 126.9 s for 8 delay + 8 effort, above the 120 s module
    limit; 8 effort + 6 delay needs a 118 s slot cap, +24 s the plan cannot fund). The non-start path (churn
    chosen, never pressed) is now logged as an incomplete hold, so v2 data stay unbiased.
