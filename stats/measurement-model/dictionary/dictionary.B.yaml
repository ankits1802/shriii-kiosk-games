- id: composure.pressure_slope_accuracy
  construct: composure
  role: primary
  tier: 2
  status: provisional
  kind: difference_slope
  source:
    module_id: dont_tap
    episode_id: null
    task: dont_tap.pressure_block
    phases:
    - main
    - pressure
    slot: false
  event_inputs:
  - trial_start
  - stimulus_onset
  - response
  - trial_end
  - context_shift
  required_fields:
  - payload.response_value
  - payload.correctness
  - payload.input_mode
  - condition.phase
  - timing.scorable
  - condition.timer
  - condition.noise
  formula:
    ref: hier.pressure_slope_accuracy
    description: Person random slope of accuracy on pressure (off vs on) from a hierarchical logistic model (logit scale;
      trial type and block position as fixed effects).
  unit: slope
  direction: higher_more
  transformation: none
  aggregation: slope
  reliability_method: model_based_slope
  level_rule: fixed_level_only
  min_valid_trials:
    count: 30
    unit: trials
    basis: literature_prior
  exclusions:
  - not_scorable
  - invalid_placeholder
  - interrupted_trial
  - session_quality_exclude
  - synthetic_session
  - level_not_fixed_l2
  - missing_context_shift
  missing_data: model_partial_pooling
  group_only: false
  gate_eligible: true
  timing_sensitive: false
  sensitivity: standard
  expected_r_lower_bound: 0.1
  convergent_criteria:
  - bfi2_xs.negative_emotionality
  - ders16.total
  notes: >-
    Slope is coded so that a smaller accuracy decrement under pressure is higher. Indicator review (2026-10):
    the v0 engine used a linear-probability mixed model without a trial-type term despite this description
    (r with the planted latent .30 in simulation); the logistic model with trial type is now the default
    (docs/science/indicator-review.md).
