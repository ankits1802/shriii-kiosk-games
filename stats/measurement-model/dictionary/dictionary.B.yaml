- id: self_control.choice_consistency
  construct: self_control
  role: secondary
  tier: 1
  status: provisional
  kind: raw
  source:
    module_id: wait_or_now
    episode_id: null
    task: wait_or_now.delay
    phases:
    - main
    slot: true
  event_inputs:
  - trial_start
  - stimulus_onset
  - response
  - trial_end
  required_fields:
  - payload.response_value
  - payload.correctness
  - payload.input_mode
  - condition.phase
  - timing.scorable
  formula:
    ref: discounting.choice_consistency
    description: Proportion of choices consistent with the person's fitted discounting function.
  unit: proportion
  direction: higher_more
  transformation: logit_corrected
  aggregation: proportion
  reliability_method: split_half_permutation
  level_rule: fixed_level_only
  min_valid_trials:
    count: 12
    unit: choices
    basis: plan_ac
  exclusions:
  - not_scorable
  - invalid_placeholder
  - interrupted_trial
  - session_quality_exclude
  - synthetic_session
  - level_not_fixed_l2
  missing_data: planned_missing_slot
  group_only: false
  gate_eligible: false
  timing_sensitive: false
  sensitivity: standard
  expected_r_lower_bound: 0.1
  convergent_criteria:
  - bscs.total
  notes: >-
    not_scorable_v1: requires 12 delay choices (plan_ac) but Wait-or-Now schedules 8 delay trials (trial-budget
    waiver), so it is never scored. Under the titrated delay schedule the offers converge on each person's
    indifference point, so consistency with the fitted function mostly reflects choice noise near
    indifference rather than self-control. Not gate-eligible in v1; game owners: 4 extra delay trials
    (docs/science/VAL-02-trial-requirements.md) or retire at the next amendment.
    Amendment 2026-10-wave2 (A4): stays not_scorable_v1. The +4 delay trials (or the 8-trial titrated effort
    staircase that would go with them) need about +24 s of slot cap (94 to 118 s) and the session ceiling is
    fully allocated (890 s) after the measured Card Sort, Don't-Tap and Tower fixes, so the schedule stays at 8
    delay + 4 effort choices.
