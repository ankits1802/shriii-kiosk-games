  - { id: h2.expressive_restraint, family: secondary, construct: expressive_restraint, pathways: [A, B], type: convergent_lower_bound, indicators: [expressive_restraint.premature_taps], criterion: erq.suppression, convergent_criteria: [], discriminant_criteria: [], expected_sign: positive, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_languages_and_arms_if_invariant, notes: null }
  - { id: h2.expressive_restraint.extraversion, family: secondary, construct: expressive_restraint, pathways: [A, B], type: convergent_lower_bound, indicators: [expressive_restraint.premature_taps], criterion: bfi2_xs.extraversion, convergent_criteria: [], discriminant_criteria: [], expected_sign: negative, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_languages_and_arms_if_invariant, notes: null }
