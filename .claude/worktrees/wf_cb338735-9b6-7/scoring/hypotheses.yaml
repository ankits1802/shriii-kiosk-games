  - { id: h2.composure, family: secondary, construct: composure, pathways: [A, B], type: convergent_lower_bound, indicators: [composure.pressure_slope_accuracy], criterion: bfi2_xs.negative_emotionality, convergent_criteria: [], discriminant_criteria: [], expected_sign: negative, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_languages_and_arms_if_invariant, notes: Difference-based; may remain research_only. }
  - { id: h2.composure.ders, family: secondary, construct: composure, pathways: [A, B], type: convergent_lower_bound, indicators: [composure.pressure_slope_accuracy], criterion: ders16.total, convergent_criteria: [], discriminant_criteria: [], expected_sign: negative, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_languages_and_arms_if_invariant, notes: null }
  - { id: h2.task_organisation, family: secondary, construct: task_organisation, pathways: [A], type: convergent_lower_bound, indicators: [task_organisation.errand_order_efficiency], criterion: bfi2_s.organization, convergent_criteria: [], discriminant_criteria: [], expected_sign: positive, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_if_invariant, notes: Facet from rotating block C. }
  - { id: h2.task_organisation.rational, family: secondary, construct: task_organisation, pathways: [A], type: convergent_lower_bound, indicators: [task_organisation.errand_order_efficiency], criterion: gdms.rational, convergent_criteria: [], discriminant_criteria: [], expected_sign: positive, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_if_invariant, notes: null }
  - { id: h2.adaptability.cfi, family: secondary, construct: adaptability, pathways: [A, B], type: convergent_lower_bound, indicators: [adaptability.perseverative_errors, adaptability.post_reversal_errors], criterion: cfi.total, convergent_criteria: [], discriminant_criteria: [], expected_sign: positive, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_languages_and_arms_if_invariant, notes: Rotating block B. }
