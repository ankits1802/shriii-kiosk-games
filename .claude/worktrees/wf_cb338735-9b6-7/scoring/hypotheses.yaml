  # ------------------------------------------------------------------ group level
  - { id: hg.integrity.dice_overreport, family: group_level, construct: integrity, pathways: [B], type: group_level, indicators: [integrity.dice_overreport_rate], criterion: hexaco_hh.honesty_humility, convergent_criteria: [], discriminant_criteria: [], expected_sign: negative, r0: null, statistic: group_rate_difference, pooling: per_language_and_pooled, notes: Over-report rate is higher in the lowest HEXACO-HH tertile than in the highest. Group level only. }
