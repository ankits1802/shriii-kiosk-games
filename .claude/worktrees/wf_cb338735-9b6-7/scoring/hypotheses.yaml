# SHRIII pre-registration registry (CRT-11, plan sections 4.3, 7.4-7.8).
# Frozen together with gates.yaml after both v1 dictionary freezes and before Stage 2 unblinding;
# amendments are timestamped governance records (PLT-09). Results outside this registry are exploratory.
#
# Every confirmatory/secondary result must cite a hypothesis id from this file.
# Tests use OBSERVED correlations only (disattenuated r is secondary and never feeds gates).
schema_version: "1.0"
registry_id: shriii-prereg
version: 0.1.0
status: draft
frozen_at: null
sha256: null
governance_record: null
prereg_id: null

defaults:
  r0: 0.10                 # pre-registered minimum: lower CI bound must exceed this
  ci_level: 0.95
  alpha: 0.05
  bootstrap_resamples: 5000
  permutation_resamples: 5000
  correlation: pearson     # Spearman reported alongside as robustness
  estimates: observed

families:
  - id: primary
    kind: confirmatory
    correction: holm
    alpha: 0.05
    description: One convergent lower-bound hypothesis per Tier-1 construct (8 tests, Holm-corrected) on pooled languages and arms where invariance allows.
  - id: secondary
    kind: secondary
    correction: bh_fdr
    alpha: 0.05
    description: Tier-2 convergent hypotheses and additional criteria for Tier-1 constructs.
  - id: discriminant_pattern
    kind: secondary
    correction: bh_fdr
    alpha: 0.05
    description: Own-greater-than-discriminant pattern per construct using the r_contrast-CV statistic (Westen & Rosenthal, 2003) with permutation CIs.
  - id: nomological
    kind: secondary
    correction: bh_fdr
    alpha: 0.05
    description: Pre-registered nomological predictions for the style (S) constructs.
  - id: retest
    kind: secondary
    correction: none
    alpha: 0.05
    description: Retest stability (ICC(A,1)) for style constructs, evaluated against gates.yaml thresholds; estimation, not significance testing.
  - id: exploratory
    kind: exploratory
    correction: bh_fdr
    alpha: 0.05
    description: Direction-unspecified or weak expected relations; labelled exploratory.
  - id: group_level
    kind: group_level
    correction: none
    alpha: 0.05
    description: Group-level integrity estimators (private report). Never individual.

hypotheses:
  # ------------------------------------------------------------------ primary (Tier 1, Holm over 8)
  - { id: h1.self_control, family: primary, construct: self_control, pathways: [A, B], type: convergent_lower_bound, indicators: [self_control.nogo_commission_rate], criterion: bscs.total, convergent_criteria: [], discriminant_criteria: [], expected_sign: positive, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_languages_and_arms_if_invariant, notes: Shared-paradigm indicator id; arms pooled when invariance holds. }
  - { id: h1.emotional_regulation, family: primary, construct: emotional_regulation, pathways: [A], type: convergent_lower_bound, indicators: [emotional_regulation.tone_after_provocation], criterion: ders16.total, convergent_criteria: [], discriminant_criteria: [], expected_sign: negative, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_if_invariant, notes: Pathway A only. }
  - { id: h1.decisiveness, family: primary, construct: decisiveness, pathways: [A, B], type: convergent_lower_bound, indicators: [decisiveness.time_to_collect, decisiveness.time_to_commit], criterion: gdms.avoidant, convergent_criteria: [], discriminant_criteria: [], expected_sign: negative, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_languages_and_arms_if_invariant, notes: Unit-weighted composite of the pathway's primary decisiveness indicator. }
  - { id: h1.adaptability, family: primary, construct: adaptability, pathways: [A, B], type: convergent_lower_bound, indicators: [adaptability.perseverative_errors, adaptability.post_reversal_errors], criterion: card_sort_criterion.perseverative_errors, convergent_criteria: [], discriminant_criteria: [], expected_sign: negative, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_languages_and_arms_if_invariant, notes: null }
  - { id: h1.teamwork, family: primary, construct: teamwork, pathways: [A, B], type: convergent_lower_bound, indicators: [teamwork.mean_contribution], criterion: bfi2_xs.agreeableness, convergent_criteria: [], discriminant_criteria: [], expected_sign: positive, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_languages_and_arms_if_invariant, notes: Provisional interim criterion under exception teamwork_provisional_criterion. }
  - { id: h1.problem_solving, family: primary, construct: problem_solving, pathways: [A, B], type: convergent_lower_bound, indicators: [problem_solving.excess_moves, problem_solving.excess_route_cost], criterion: tol_board.excess_moves, convergent_criteria: [], discriminant_criteria: [], expected_sign: negative, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_languages_and_arms_if_invariant, notes: "Pathway-specific primary indicators (Tower in B, route cost in A)." }
  - { id: h1.risk_preference, family: primary, construct: risk_preference, pathways: [B], type: convergent_lower_bound, indicators: [risk_preference.adjusted_pumps], criterion: general_risk.risk_willingness, convergent_criteria: [], discriminant_criteria: [], expected_sign: positive, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_if_invariant, notes: Restricted construct; capped at broad style. }
  - { id: h1.persistence, family: primary, construct: persistence, pathways: [A, B], type: convergent_lower_bound, indicators: [persistence.time_on_unsolvable, persistence.retries_on_blocked_route], criterion: grit_s.total, convergent_criteria: [], discriminant_criteria: [], expected_sign: positive, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_languages_and_arms_if_invariant, notes: null }

  # ------------------------------------------------------------------ secondary convergent
  - { id: h2.self_control.conscientiousness, family: secondary, construct: self_control, pathways: [A, B], type: convergent_lower_bound, indicators: [self_control.nogo_commission_rate], criterion: bfi2_xs.conscientiousness, convergent_criteria: [], discriminant_criteria: [], expected_sign: positive, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_languages_and_arms_if_invariant, notes: null }
