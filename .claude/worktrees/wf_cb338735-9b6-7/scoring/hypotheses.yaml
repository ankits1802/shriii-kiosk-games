  - { id: h2.initiative.assertiveness, family: secondary, construct: initiative, pathways: [A, B], type: convergent_lower_bound, indicators: [initiative.unprompted_share, initiative.optional_actions_unprompted], criterion: bfi2_s.assertiveness, convergent_criteria: [], discriminant_criteria: [], expected_sign: positive, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_languages_and_arms_if_invariant, notes: null }
