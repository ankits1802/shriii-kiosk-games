targets:
  completion: { supervised: 0.85, open_public: 0.60 }
  play_again: 0.70
  per: [language, arm, site_mode]

exceptions:
  - id: teamwork_provisional_criterion
    construct: teamwork
    description: Interim criterion is BFI-2 Agreeableness plus an administrator-rated observed cooperation task, because a scripted partner cannot give a rating.
    cap_status: validated_broad_style
    lifted_when: Partner-rating evidence from the live-dyad substudy passes the trait-gate convergent rule and inter-rater ICC(A,1) lower bound >= .60.

research_only_path:
  - { step: 1, rule: A construct failing trait-gate rules B1-B3 after Stage 3 becomes research_only; it is collected only if it contributes to the battery gate or to wave-2 redesign. }
  - { step: 2, rule: "Wave 2 may add trials or redesign tasks (ENG-13), which needs a new dictionary version and a pre-registration amendment." }
  - { step: 3, rule: Two consecutive failures lead to a recommendation to drop the construct from player reports permanently. }
  - { step: 4, rule: A memo to stakeholders after Stage 3 lists the reportable subset. }

coverage:
  - { construct: self_control, A: confirmatory, B: confirmatory }
  - { construct: emotional_regulation, A: confirmatory, B: withheld }
  - { construct: composure, A: exploratory, B: exploratory }
  - { construct: response_consistency, A: exploratory, B: exploratory }
  - { construct: task_organisation, A: exploratory, B: withheld }
  - { construct: decisiveness, A: confirmatory, B: confirmatory }
  - { construct: adaptability, A: confirmatory, B: confirmatory }
  - { construct: persistence_of_style, A: exploratory, B: exploratory }
  - { construct: stability, A: exploratory, B: exploratory }
  - { construct: expressive_restraint, A: exploratory, B: exploratory }
  - { construct: teamwork, A: confirmatory, B: confirmatory }
  - { construct: judgement, A: exploratory, B: withheld }
  - { construct: problem_solving, A: confirmatory, B: confirmatory }
  - { construct: integrity, A: exploratory, B: group_only }
  - { construct: initiative, A: exploratory, B: exploratory }
  - { construct: risk_preference, A: withheld, B: confirmatory }
  - { construct: persistence, A: confirmatory, B: confirmatory }
