  - { id: h2.teamwork.partner, family: secondary, construct: teamwork, pathways: [A], type: convergent_lower_bound, indicators: [teamwork.turn_waiting, teamwork.coplay_credit_share], criterion: partner_rating.total, convergent_criteria: [], discriminant_criteria: [], expected_sign: positive, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_if_invariant, notes: Live-dyad substudy (target >= 120 dyads pooled). }
  - { id: h2.judgement, family: secondary, construct: judgement, pathways: [A], type: convergent_lower_bound, indicators: [judgement.credit_taking], criterion: hexaco_hh.honesty_humility, convergent_criteria: [], discriminant_criteria: [], expected_sign: positive, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_if_invariant, notes: null }
  - { id: h2.judgement.moral_identity, family: secondary, construct: judgement, pathways: [A], type: convergent_lower_bound, indicators: [judgement.credit_taking], criterion: moral_identity.internalization, convergent_criteria: [], discriminant_criteria: [], expected_sign: positive, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_if_invariant, notes: Rotating block A. }
  - { id: h2.problem_solving.intellect, family: secondary, construct: problem_solving, pathways: [A, B], type: convergent_lower_bound, indicators: [problem_solving.excess_moves, problem_solving.excess_route_cost], criterion: bfi2_s.intellectual_curiosity, convergent_criteria: [], discriminant_criteria: [], expected_sign: positive, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_languages_and_arms_if_invariant, notes: Facet from rotating block C. }
  - { id: h2.integrity, family: secondary, construct: integrity, pathways: [A], type: convergent_lower_bound, indicators: [integrity.bribe_acceptance, integrity.overpayment_return], criterion: hexaco_hh.honesty_humility, convergent_criteria: [], discriminant_criteria: [], expected_sign: positive, r0: 0.10, statistic: observed_r_lower_bound, pooling: pooled_if_invariant, notes: Weighing Post indicators only; dice never enters individual MTMM. }
