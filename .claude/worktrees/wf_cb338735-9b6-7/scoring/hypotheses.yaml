  - { id: h3.decisiveness.rational, family: exploratory, construct: decisiveness, pathways: [A, B], type: convergent_lower_bound, indicators: [decisiveness.time_to_collect, decisiveness.time_to_commit], criterion: gdms.rational, convergent_criteria: [], discriminant_criteria: [], expected_sign: null, r0: null, statistic: observed_r_lower_bound, pooling: per_language_and_pooled, notes: Direction not pre-specified. }
