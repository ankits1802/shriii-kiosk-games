<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="SHRIII mela lantern">
  <!--
    SHRIII kiosk app icon: a glowing paper lantern under a marigold-and-mango-leaf toran at dusk.
    Original hand-authored artwork for this project (no third-party imagery). No text, no numerals.
    Usable for the Electron window icon, PWA manifest and favicon (scales cleanly down to 32 px).
  -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#5b4687"/>
      <stop offset="0.55" stop-color="#2e2a5a"/>
      <stop offset="1" stop-color="#1b1838"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff2b0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="paper" cx="50%" cy="58%" r="62%">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.45" stop-color="#ffc26a"/>
      <stop offset="1" stop-color="#e8692e"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d47a"/>
      <stop offset="1" stop-color="#b8862a"/>
    </linearGradient>
    <g id="marigold">
      <circle r="22" fill="#e8871e"/>
      <circle cx="0" cy="-12" r="11" fill="#f6b11f"/>
      <circle cx="11" cy="-4" r="11" fill="#f6b11f"/>
      <circle cx="7" cy="10" r="11" fill="#f6b11f"/>
      <circle cx="-7" cy="10" r="11" fill="#f6b11f"/>
      <circle cx="-11" cy="-4" r="11" fill="#f6b11f"/>
      <circle r="6" fill="#b85a14"/>
    </g>
    <path id="leaf" d="M0 0 C -16 22 -12 52 0 74 C 12 52 16 22 0 0 Z" fill="#4f8f3a"/>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff6dc">
    <circle cx="190" cy="300" r="5"/><circle cx="840" cy="250" r="6"/><circle cx="760" cy="420" r="4"/>
    <circle cx="250" cy="520" r="4"/><circle cx="880" cy="600" r="5"/><circle cx="140" cy="700" r="4"/>
  </g>
  <!-- toran: rope, mango leaves and marigold strands -->
  <path d="M40 120 Q 512 230 984 120" fill="none" stroke="#8a5a2a" stroke-width="14" stroke-linecap="round"/>
  <g>
    <use href="#leaf" transform="translate(140 152) rotate(-6)"/>
    <use href="#leaf" transform="translate(260 180) rotate(4)"/>
    <use href="#leaf" transform="translate(764 180) rotate(-4)"/>
    <use href="#leaf" transform="translate(884 152) rotate(6)"/>
    <use href="#leaf" transform="translate(380 196)"/>
    <use href="#leaf" transform="translate(644 196)"/>
  </g>
  <g>
    <use href="#marigold" transform="translate(200 186)"/><use href="#marigold" transform="translate(200 230)"/>
    <use href="#marigold" transform="translate(824 186)"/><use href="#marigold" transform="translate(824 230)"/>
    <use href="#marigold" transform="translate(320 210)"/><use href="#marigold" transform="translate(704 210)"/>
  </g>
  <!-- lantern glow -->
  <circle cx="512" cy="600" r="380" fill="url(#glow)"/>
  <!-- hanger -->
  <line x1="512" y1="214" x2="512" y2="330" stroke="#43281a" stroke-width="12" stroke-linecap="round"/>
  <rect x="452" y="326" width="120" height="34" rx="12" fill="url(#brass)"/>
  <!-- lantern body -->
  <path d="M438 360 C 338 430 338 690 452 790 L 572 790 C 686 690 686 430 586 360 Z" fill="url(#paper)" stroke="#9c4a1a" stroke-width="8"/>
  <g fill="none" stroke="#b85a2a" stroke-width="6" stroke-opacity="0.55">
    <path d="M480 364 Q 432 575 482 786"/>
    <path d="M512 362 Q 512 575 512 788"/>
    <path d="M544 364 Q 592 575 542 786"/>
  </g>
  <!-- flame core -->
  <path d="M512 640 C 488 620 494 580 512 548 C 530 580 536 620 512 640 Z" fill="#fff8e0"/>
  <rect x="462" y="786" width="100" height="30" rx="10" fill="url(#brass)"/>
  <!-- tassel -->
  <line x1="512" y1="816" x2="512" y2="880" stroke="#d9402b" stroke-width="10" stroke-linecap="round"/>
  <circle cx="512" cy="896" r="20" fill="#d9402b"/>
</svg>
