# BFI-2-XS — criterion instrument registry entry (CRT-02/03/04).
# Copyrighted item wording is NOT stored here: each item has a placeholder and item_text_source.
# Real wording is loaded at administration time from the licensed source file.
schema_version: '1.0'
instrument_id: bfi2_xs
name: Big Five Inventory-2 Extra-Short Form
short_name: BFI-2-XS
version: 1.0.0
kind: questionnaire
citation: 'Soto, C. J., & John, O. P. (2017). Short and extra-short forms of the Big Five Inventory-2: The BFI-2-S and BFI-2-XS. Journal of Research
  in Personality, 68, 69-81.'
constructs_measured:
- self_control
- composure
- teamwork
- initiative
- stability
- response_consistency
- expressive_restraint
- persistence_of_style
licensing:
