# "Infinitely fast disk" proxy for separating application cost from storage cost.
#   docker compose -f tools/loadtest/docker-compose.yml -f tools/loadtest/docker-compose.fastdisk.yml up -d --wait
# It turns off durability (fsync, synchronous_commit, full_page_writes). NEVER use these settings for real
# data. Results from this profile are a lower bound on what faster storage could give; report them next
# to the durable profile, never instead of it.
services:
  postgres:
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - track_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
