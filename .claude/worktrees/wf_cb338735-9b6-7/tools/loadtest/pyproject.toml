[project]
name = "shriii-loadtest"
version = "0.1.0"
description = "Load, soak and correctness tests for the SHRIII ingestion and research APIs (QA-05, ING-02)"
requires-python = ">=3.13"
dependencies = [
  "shriii-contracts",
  "shriii-simulator",
  "httpx>=0.28",
  "locust>=2.40",
  "pynacl>=1.5",
  "cryptography>=44",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
]

[project.optional-dependencies]
profile = ["py-spy>=0.4"]
audit = ["pip-audit>=2.9"]

[project.scripts]
shriii-loadtest = "shriii_loadtest.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shriii_loadtest"

[tool.uv.sources]
shriii-contracts = { workspace = true }
shriii-simulator = { workspace = true }
