  - id: integrity
    number: 14
    name: Integrity
    kind: M
    tier: 2
    restricted: true
    modelled_as: trait_indicator
    definition: Choosing honest, rule-consistent actions when a temptation offers a private benefit.
    theoretical_justification: Behavioural honesty is observable in bribe and overpayment dilemmas; private-report (dice) tasks identify dishonesty only statistically at group level (Fischbacher & Follmi-Heusi, 2013), so dice never yields individual scores.
    ecd:
      claim: The player declines bribes and returns overpayments.
      evidence: Individual - bribe acceptance and overpayment return (at least 3 each). Group only - dice over-report rate and distribution skew.
      tasks: [Weighing Post bribe, Weighing Post overpayment, Private Dice (group level only), Luck tokens (group level only)]
    pathways:
      A: { status: scored, reason: null }
      B: { status: group_only, reason: "Pathway B has only Private Dice, which is group level only; no individual integrity indicator exists in B." }
    criterion_relations:
      convergent:
        - { criterion: hexaco_hh.honesty_humility, block: X, expected_sign: positive, expected_r_low: 0.05, expected_r_high: 0.20, hypothesis_id: h2.integrity, note: Individual MTMM uses Weighing indicators only. }
      discriminant:
        - { criterion: bscs.total, block: X, expected_sign: null, hypothesis_id: hp.integrity, note: null }
        - { criterion: cfi.total, block: B, expected_sign: null, hypothesis_id: hp.integrity, note: null }
      nomological: []
    report:
      max_status: validated_broad_style
      phrase_keys: { pole_a: report.integrity.pole_a, centre: report.integrity.centre, pole_b: report.integrity.pole_b }
    notes: Restricted. Capped at broad style with a stricter flag, or withheld. A participant is never classified as dishonest.

